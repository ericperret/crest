<script>
// ════════════════════════════════════════════════════════════════
// GLUE UI — déclaré AVANT dsm-astro.js / dsm-worker-tiff.js /
// dsm-ombre.js / dsm-insol.js (scope global partagé ; les références
// croisées sont résolues à l'exécution)
// ════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════
// PANNEAU CONTRÔLE GAUCHE — Année / Jour / Heure
// Clavier : ↑↓ sélectionne le slider actif, ←→ incrémente/décrémente
// Souris  : clic [+]/[-] ou clic sur la barre = position directe
// ════════════════════════════════════════════════════════════════

// ── État contrôle ───────────────────────────────────────────────
const CTRL_ANNEE_MIN = -20000;
const CTRL_ANNEE_MAX = 2100;
let ctrlAnnee  = 2024;     // année affichée
let ctrlJour   = 354;      // 0-based (354 = 21 déc)
let ctrlHeure  = 12.0;     // heures UTC décimales
let ctrlActif  = 1;        // slider actif : 0=année 1=jour 2=heure

// ── ctrlRiseSet — sunrise/sunset pour ctrlJour + ctrlAnnee ─────────
// Retourne { rise, set } UTC décimales, ou null si GEO absent.
function ctrlRiseSet() {
  if (!GEO) return null;
  var orb   = orbital(ctrlTka());
  var pibar = orb.pib + Math.PI;
  var lat   = (GEO.latMax + GEO.latMin) / 2;
  var lon   = (GEO.lonMax + GEO.lonMin) / 2;
  return sunRiseSet(ctrlJour + 1, orb.e, orb.eps, pibar, lat * Math.PI / 180, lon);
}

// ── ctrlRendrePanneau — met à jour tous les affichages du panneau ─
function ctrlRendrePanneau() {
  // Année
  document.getElementById('ctrl-val-0').textContent =
    ctrlAnnee.toLocaleString('fr-FR').replace(/\u202f/g, '\u00a0');
  var fA = (ctrlAnnee - CTRL_ANNEE_MIN) / (CTRL_ANNEE_MAX - CTRL_ANNEE_MIN);
  document.getElementById('ctrl-fill-0').style.width = (fA * 100).toFixed(1) + '%';

  // Jour
  document.getElementById('ctrl-val-1').textContent = jourVersDate(ctrlJour);
  document.getElementById('ctrl-fill-1').style.width = (ctrlJour / 364 * 100).toFixed(1) + '%';

  // Lever / coucher — calculé localement depuis orbital + sunRiseSet
  var rh   = ctrlRiseSet();
  var rise = (rh && rh.rise >= 0) ? rh.rise : 0;
  var setH = (rh && rh.set  >= 0) ? rh.set  : 24;
  document.getElementById('ctrl-rise').textContent =
    rh ? '\ud83c\udf05 ' + hDecToHHMM(rise) : '\ud83c\udf05 --h--';
  document.getElementById('ctrl-set').textContent  =
    rh ? '\ud83c\udf07 ' + hDecToHHMM(setH) : '\ud83c\udf07 --h--';

  // Heure — clampée entre sunrise et sunset
  ctrlHeure = Math.max(rise, Math.min(setH, ctrlHeure));
  insolHour = ctrlHeure;
  document.getElementById('ctrl-val-2').textContent = hDecToHHMM(ctrlHeure);
  var span = Math.max(0.01, setH - rise);
  var fH   = Math.max(0, Math.min(1, (ctrlHeure - rise) / span));
  document.getElementById('ctrl-fill-2').style.width = (fH * 100).toFixed(1) + '%';

  // Az / él soleil
  if (GEO) {
    var orb   = orbital(ctrlTka());
    var pibar = orb.pib + Math.PI;
    var lat   = (GEO.latMax + GEO.latMin) / 2;
    var lon   = (GEO.lonMax + GEO.lonMin) / 2;
    var pos   = sunPos(ctrlJour + 1, ctrlHeure, orb.e, orb.eps, pibar,
                            lat * Math.PI / 180, lon);
    document.getElementById('ctrl-sunpos').textContent =
      'az ' + pos.az.toFixed(0) + '°  él ' + pos.el.toFixed(1) + '°';
    if (ombreMask) ctrlMajPas(pos);
  }

  // Highlight label actif
  for (var i = 0; i < 3; i++) {
    var lbl = document.getElementById('ctrl-lbl-' + i);
    lbl.classList.toggle('actif', i === ctrlActif);
  }
} 













// ── ctrlTka — année → t_ka (kiloyears before 1950) ───────────────
function ctrlTka() {
  return (ctrlAnnee - 1950) / 1000;   // négatif = passé (LGM ≈ -20), positif = présent/futur
}

// ── ctrlMajPas — choisit le pas ombreStep le plus proche de ctrlHeure
//    puis déclenche ombreRendreFrame ────────────────────────────────
function ctrlMajPas(pos) {
  if (!ombreSunAz || !ombreNSteps) return;


// On trouve l'index (t) directement grace a l'ecart de temps
// 1 pas = 0.25 heure (15 min)
var t = Math.round((ctrlHeure - ombreHeureStart) / 0.25);
ombreStep = Math.max(0, Math.min(ombreNSteps - 1, t));

  ombreSliderDirty = true;
  ombreRendreFrame();
}

// ── declencherPasse2 — debounce 150ms, garde sur ombreHorizonCopy uniquement ─
// (ombreHorizon fait des allers-retours zero-copy et peut être null — ne pas le tester)
let passe2Timer = 0;
function declencherPasse2() {
  clearTimeout(passe2Timer);
  passe2Timer = setTimeout(function() {
    if (ombreHorizonCopy) lancerPasse2Seule();
  }, 150);
}

// ── ctrlIncrementer — appelé par clavier ou boutons +/- ──────────
function ctrlIncrementer(idx, sens) {   // sens = +1 ou -1
  if (idx === 0) {
    // Année
    ctrlAnnee = Math.max(CTRL_ANNEE_MIN, Math.min(CTRL_ANNEE_MAX, ctrlAnnee + sens));
    // Recalculer lever/coucher pour la nouvelle époque
    // Recalcul passe 2 si horizon déjà calculé
    declencherPasse2();
    // Recalcul carte insolation si la vue insol est active (dsm-insol.js)
    if (typeof insolActive !== 'undefined' && insolActive) insolRecalcul();
    // Recalcul carte température si la vue temp est active (dsm-temp.js)
    if (typeof tempActive !== 'undefined' && tempActive) tempRecalcul();
  } else if (idx === 1) {
    // Jour
    ctrlJour = Math.max(0, Math.min(364, ctrlJour + sens));
    insolDay = ctrlJour;
    // Clamper heure dans la nouvelle plage lever/coucher
    var rh1 = ctrlRiseSet();
    if (rh1 && rh1.rise >= 0 && rh1.set >= 0)
      ctrlHeure = Math.max(rh1.rise, Math.min(rh1.set, ctrlHeure));
    insolHour = ctrlHeure;
    // Recalcul passe 2 si horizon déjà calculé
    declencherPasse2();
  } else if (idx === 2) {
    // Heure ± 15 min
    ctrlHeure += sens * 0.25;
    var rh2 = ctrlRiseSet();
    if (rh2 && rh2.rise >= 0 && rh2.set >= 0)
      ctrlHeure = Math.max(rh2.rise, Math.min(rh2.set, ctrlHeure));
    insolHour = ctrlHeure;
  }
  ctrlRendrePanneau();
}
window.addEventListener('keydown', function(e) {
  // J'ai aussi ajouté la logique Haut/Bas évoquée dans vos commentaires si vous le souhaitez :
  if (e.key === 'ArrowUp')    { e.preventDefault(); ctrlActif = Math.max(0, ctrlActif - 1); ctrlRendrePanneau(); }
  if (e.key === 'ArrowDown')  { e.preventDefault(); ctrlActif = Math.min(2, ctrlActif + 1); ctrlRendrePanneau(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); ctrlIncrementer(ctrlActif, -1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); ctrlIncrementer(ctrlActif, +1); }
});

// ── Boutons +/- : clic simple + clic maintenu accéléré ───────────
// Délai initial 380ms, puis repeat à 180ms → 90ms → 45ms → 25ms (paliers ×5)
(function() {
  var pmTimer = 0, pmIdx = -1, pmSens = 0, pmCount = 0;

  function pmStop() {
    clearTimeout(pmTimer); clearInterval(pmTimer);
    pmTimer = 0; pmIdx = -1; pmSens = 0; pmCount = 0;
  }

  function pmTick() {
    if (pmIdx < 0) return;
    ctrlActif = pmIdx;
    ctrlIncrementer(pmIdx, pmSens);
    pmCount++;
    // Accélération par paliers : 180 → 90 → 45 → 25 ms
    var delay = pmCount < 5  ? 180 :
                pmCount < 15 ?  90 :
                pmCount < 30 ?  45 : 25;
    pmTimer = setTimeout(pmTick, delay);
  }

  function pmStart(idx, sens) {
    pmStop();
    pmIdx = idx; pmSens = sens; pmCount = 0;
    ctrlActif = idx;
    ctrlIncrementer(idx, sens);          // réaction immédiate au premier clic
    pmTimer = setTimeout(pmTick, 380);   // délai avant répétition
  }

  for (var i = 0; i < 3; i++) {
    (function(idx) {
      var plus  = document.getElementById('ctrl-plus-'  + idx);
      var minus = document.getElementById('ctrl-minus-' + idx);

      plus.addEventListener('mousedown',  function(e){ e.preventDefault(); pmStart(idx, +1); });
      minus.addEventListener('mousedown', function(e){ e.preventDefault(); pmStart(idx, -1); });
    })(i);
  }

  window.addEventListener('mouseup',    pmStop);
  window.addEventListener('mouseleave', pmStop);
})();

// ── Barre slider : clic direct + drag maintenu ───────────────────
(function() {
  var dragIdx = -1;   // index du slider en cours de drag (-1 = aucun)

  function applyPct(idx, pct) {
    pct = Math.max(0, Math.min(1, pct));
    if (idx === 0) {
      ctrlAnnee = Math.round(CTRL_ANNEE_MIN + pct * (CTRL_ANNEE_MAX - CTRL_ANNEE_MIN));
      declencherPasse2();
      if (typeof insolActive !== 'undefined' && insolActive) insolRecalcul();
      if (typeof tempActive  !== 'undefined' && tempActive)  tempRecalcul();
    } else if (idx === 1) {
      ctrlJour = Math.round(pct * 364);
      insolDay = ctrlJour;
      var rh3 = ctrlRiseSet();
      if (rh3 && rh3.rise >= 0 && rh3.set >= 0)
        ctrlHeure = Math.max(rh3.rise, Math.min(rh3.set, ctrlHeure));
      insolHour = ctrlHeure;
      declencherPasse2();
    } else {
      var rh4 = ctrlRiseSet();
      if (rh4 && rh4.rise >= 0 && rh4.set >= 0) {
        ctrlHeure = rh4.rise + pct * (rh4.set - rh4.rise);
        ctrlHeure = Math.max(rh4.rise, Math.min(rh4.set, ctrlHeure));
      }
      insolHour = ctrlHeure;
    }
    ctrlRendrePanneau();
  }

  for (var i = 0; i < 3; i++) {
    (function(idx) {
      var bar = document.getElementById('ctrl-bar-' + idx);
      bar.addEventListener('mousedown', function(e) {
        e.preventDefault();
        ctrlActif = idx;
        dragIdx   = idx;
        var r   = bar.getBoundingClientRect();
        applyPct(idx, (e.clientX - r.left) / r.width);
      });
    })(i);
  }

  window.addEventListener('mousemove', function(e) {
    if (dragIdx < 0) return;
    var bar = document.getElementById('ctrl-bar-' + dragIdx);
    var r   = bar.getBoundingClientRect();
    applyPct(dragIdx, (e.clientX - r.left) / r.width);
  });

  window.addEventListener('mouseup', function() { dragIdx = -1; });
})();

// ── ctrlOuvrir / ctrlFermer ────────────────────────────────────────
function ctrlOuvrir() {
  document.getElementById('ctrl-panel').classList.add('visible');
  ctrlRendrePanneau();
  resizeWrap();
  render();
}
function ctrlFermer() {
  document.getElementById('ctrl-panel').classList.remove('visible');
  resizeWrap();
  render();
}

// ════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════
// CONSTANTES & ÉTAT GLOBAL
// ════════════════════════════════════════════════════════════════
const DISP  = 1024;
const LEG_W = 80;

let GEO = null, elevGrid = null;
let ctrlPanneauOuvert = false;
let oscHypso = null, oscContour = null, oscWater = null;
let imgW = 0, imgH = 0, srcX = 0, srcY = 0, srcPPx = 1;
let viewMode = 'hypso';
let hypsoLUT = null, vminGlobal = 0, vmaxGlobal = 1000;

// ════════════════════════════════════════════════════════════════
// GÉOGRAPHIE & DMS
// ════════════════════════════════════════════════════════════════
function toDMS(dd, isLat) {
  const hem = isLat ? (dd>=0?'N':'S') : (dd>=0?'E':'W');
  const abs = Math.abs(dd), d = Math.floor(abs);
  const m   = Math.floor((abs-d)*60);
  const s   = ((abs-d-m/60)*3600).toFixed(1);
  return `${d}°${String(m).padStart(2,'0')}'${String(s).padStart(4,'0')}"${hem}`;
}

// ════════════════════════════════════════════════════════════════
// LUT HYPSOMÉTRIQUE — utilisée uniquement pour la légende
// (dupliquée dans le Worker pour les pixels)
// ════════════════════════════════════════════════════════════════
function makeHypsoLUT() {
  const stops = [
    [0.00,20,90,20],[0.12,80,160,50],[0.25,180,170,80],
    [0.40,180,130,50],[0.58,140,85,30],[0.74,130,100,80],
    [0.88,200,190,180],[1.00,255,255,255],
  ];
  const lut = new Uint8Array(256*3);
  for(let i=0;i<256;i++){
    const t=i/255; let s0=stops[0],s1=stops[1];
    for(let k=0;k<stops.length-1;k++)
      if(t>=stops[k][0]&&t<=stops[k+1][0]){s0=stops[k];s1=stops[k+1];break;}
    const f=s1[0]===s0[0]?0:(t-s0[0])/(s1[0]-s0[0]);
    lut[i*3]  =Math.round(s0[1]+f*(s1[1]-s0[1]));
    lut[i*3+1]=Math.round(s0[2]+f*(s1[2]-s0[2]));
    lut[i*3+2]=Math.round(s0[3]+f*(s1[3]-s0[3]));
  }
  hypsoLUT = lut;
  return lut;
}

// ════════════════════════════════════════════════════════════════
function drawLegend() {
  // Légende W/m² quand la vue insolation est affichée (dsm-insol.js)
  if (typeof insolActive!=='undefined' && insolActive && insolImgData){
    drawLegendInsol(); return;
  }
  const lcv = document.getElementById('lcv');
  if(!lcv||!hypsoLUT||vmaxGlobal<=vminGlobal) return;
  // Restaurer titre/unité altitude (basculés par drawLegendInsol)
  const legT=document.querySelector('#legend-panel .leg-title');
  const legU=document.querySelector('#legend-panel .leg-unit');
  if(legT) legT.textContent='ALTITUDE';
  if(legU) legU.textContent='mètres';
  const lh = lcv.height, lw = lcv.width;
  if(lh < 10) return;
  const lctx = lcv.getContext('2d');
  lctx.clearRect(0,0,lw,lh);
  const barX=0, barW=22, textX=barW+3, barH=lh-4, barY=2;
  for(let y=0;y<barH;y++){
    const t=1-y/barH, i=Math.round(t*255);
    lctx.fillStyle=`rgb(${hypsoLUT[i*3]},${hypsoLUT[i*3+1]},${hypsoLUT[i*3+2]})`;
    lctx.fillRect(barX, barY+y, barW, 1);
  }
  lctx.font='8px monospace';
  for(const t of [0,.25,.5,.75,1.0]){
    const elev = vminGlobal + t*(vmaxGlobal-vminGlobal);
    const y    = barY + Math.round((1-t)*barH);
    lctx.fillStyle='rgba(180,190,210,.6)'; lctx.fillRect(barX+barW,y,4,1);
    lctx.fillStyle='#a6adc8'; lctx.fillText(`${Math.round(elev)}`,textX+4,y+3);
  }
  if(wet&&wet.size>0&&waterLevel>vminGlobal){
    const t = Math.min(1,Math.max(0,(waterLevel-vminGlobal)/(vmaxGlobal-vminGlobal)));
    const y = barY + Math.round((1-t)*barH);
    lctx.strokeStyle='rgba(80,160,255,.9)'; lctx.lineWidth=1.5;
    lctx.beginPath(); lctx.moveTo(barX,y); lctx.lineTo(barX+barW+8,y); lctx.stroke();
    lctx.fillStyle='rgba(80,160,255,.9)';
    lctx.fillText(`${Math.round(waterLevel)}`,textX+4,y-2);
  }
}

function render() {

  if (typeof insolActive!=='undefined' && insolActive && insolImgData){
    insolRedessiner(); return;
  }

  if(!ctrlPanneauOuvert){ ctrlPanneauOuvert=true; ctrlOuvrir();
    document.getElementById('btn-glacier').disabled=false; }
  const sw=DISP*srcPPx, sh=DISP*srcPPx;
  srcX=Math.max(0,Math.min(imgW-sw,srcX));
  srcY=Math.max(0,Math.min(imgH-sh,srcY));
  ctx.clearRect(0,0,DISP,DISP);
  ctx.imageSmoothingEnabled=false;                 // données scientifiques : pas de lissage
  const sX=Math.round(srcX), sY=Math.round(srcY), sW=Math.round(sw), sH=Math.round(sh);
  ctx.drawImage(osc,sX,sY,sW,sH,0,0,DISP,DISP);
  if(oscWater) ctx.drawImage(oscWater,sX,sY,sW,sH,0,0,DISP,DISP);

  // ─── CALQUE DE PARTAGE : lignes fines → moyennage d'aire (sinon zigzag au dézoom) ───
  if (partageActif && partageOsc) {
    const rx = 1024 / imgW, ry = 1024 / imgH;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(partageOsc, srcX*rx, srcY*ry, sw*rx, sh*ry, 0, 0, DISP, DISP);
    ctx.imageSmoothingEnabled = false;
  }


  // ─── CALQUE FIL DE FER : frontières des patches coagulés (diagnostic) ───
  if (filActif && filOsc) {
    const rx = 1024 / imgW, ry = 1024 / imgH;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(filOsc, srcX*rx, srcY*ry, sw*rx, sh*ry, 0, 0, DISP, DISP);
    ctx.imageSmoothingEnabled = false;
  }

  syncCarto();
  document.getElementById('vinfo').textContent=`zoom ×${(1/srcPPx).toFixed(2)}`;
  drawLegend();
}

// ════════════════════════════════════════════════════════════════
// FLUX — flèches de vitesse (sens de glissade) + contour extension max.
// Couleur : bleu (lent) → rouge (rapide, échelle log). Taille ∝ vitesse.
// Densité : 1 flèche max par cellule de 16 px (la plus rapide).
// ════════════════════════════════════════════════════════════════
let fluxOsc = null, fluxActif = false, fluxLogUne = false;
const btnFlux = document.getElementById('btn-flux');

function fluxDessiner() {
  const F = window.dsmFilet;
  if (!F || !F.vit) return;
  if (!fluxOsc) fluxOsc = new OffscreenCanvas(1024, 1024);
  const c = fluxOsc.getContext('2d');
  c.clearRect(0, 0, 1024, 1024);
  // Flèches : sous-échantillonnage 16 px, la plus rapide de chaque cellule
  let vMax = 0;
  for (let t = 0; t < F.nTri; t++) if (F.vit[t] > vMax) vMax = F.vit[t];
  if (vMax <= 0) { if(fluxLogUne) console.log('[FLUX] vitesse max = 0 — glace trop mince'); fluxLogUne=false; return; }
  if(fluxLogUne){ console.log('[FLUX] vitesse max = '+vMax.toFixed(3)+' m/an'); fluxLogUne=false; }
  const best = new Int32Array(64 * 64).fill(-1);
  for (let t = 0; t < F.nTri; t++) {
    if (F.vit[t] < 0.01) continue;                      // seuil AFFICHAGE 1 cm/an (glace mince : mm/an, normal SIA)
    const cx = (F.centIdx[t] % 1024) >> 4, cy = ((F.centIdx[t] / 1024) | 0) >> 4;
    const k = cy * 64 + cx;
    if (best[k] < 0 || F.vit[t] > F.vit[best[k]]) best[k] = t;
  }
  const lv = v => Math.log1p(v) / Math.log1p(vMax);     // 0..1 échelle log
  for (let k = 0; k < best.length; k++) {
    const t = best[k]; if (t < 0) continue;
    const f = lv(F.vit[t]);
    const x0 = F.centIdx[t] % 1024, y0 = (F.centIdx[t] / 1024) | 0;
    const L = 5 + 14 * f;
    const dx = F.vx[t] / F.vit[t], dy = F.vy[t] / F.vit[t];
    const x1 = x0 + dx * L, y1 = y0 + dy * L;
    // bleu #89b4fa (lent) → rouge #f38ba8 (rapide)
    const r = Math.round(137 + f * 106), g = Math.round(180 - f * 41), b = Math.round(250 - f * 82);
    c.strokeStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    c.lineWidth = 1 + 1.5 * f;
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1);
    c.moveTo(x1, y1); c.lineTo(x1 - (dx - dy * 0.6) * L * 0.3, y1 - (dy + dx * 0.6) * L * 0.3);
    c.moveTo(x1, y1); c.lineTo(x1 - (dx + dy * 0.6) * L * 0.3, y1 - (dy - dx * 0.6) * L * 0.3);
    c.stroke();
  }
}

  }
  if (!filOsc) {

// ════════════════════════════════════════════════════════════════
// GLACIER — accumulation neige/glace (pile 1..8)
// Pas élémentaire : 5 jours. 730 pas = 10 ans.
// Sources : elevGrid (altitude), dsm-temp.js (température),
//           dsm-astro.js (orbital, sunRiseSet), dsmMesh (cos θ).
// ════════════════════════════════════════════════════════════════
const GLAC_DIM      = 1024;
const GLAC_N        = GLAC_DIM * GLAC_DIM;
const GLAC_PAS_J    = 5;          // jours par pas
const GLAC_ANS      = 10;         // durée accumulation
const GLAC_NSTEPS   = Math.round(GLAC_ANS * 365 / GLAC_PAS_J);  // 730 (phase 1)
const GLAC_EPOQUE_INIT = -30;     // ka — départ PRÉ-LGM : la spline paléo clampe au creux
                                  // LGM pour t<-20 → 10 ka de plein froid pour la crue
                                  // glaciaire AVANT la courbe (Roattino 2022 : front du lobe
                                  // lyonnais déjà au maximum à 24-21 ka).
// ── Phase 2 : cycle climatique complet LGM → présent (forçage accéléré) ──
const GLAC_EPOQUE_FIN  = 0.026;   // ka — 2026 (convention : présent ≈ 0..+1)
const GLAC_CYCLE_ANS   = Math.ceil((0.026 - GLAC_EPOQUE_INIT) * 1000);  // TEMPS RÉEL : époque init → 2026
const GLAC_KA_PAR_AN   = 0.001;   // TEMPS RÉEL : 1 an simulé = 1 an de climat (compression 200:1 SUPPRIMÉE)
const GLAC_NSTEPS2     = GLAC_CYCLE_ANS * Math.round(365/GLAC_PAS_J);  // pas de la phase 2 (GLAC_NJOURS déclaré plus bas)
const GLAC_NSTEPS_TOT  = GLAC_NSTEPS + GLAC_NSTEPS2;
const GLAC_FOEHN_RECALC_KA = 5;   // recalcul foehn (capVent dépend de t_ka) tous les 5 ka
const FLUX_PENTE_MODE = 'A';   // 'A' = centroïdes | 'B' = contact inter-triangles
const FLUX_E_GLEN     = 3;     // facteur d'accroissement de la déformation — glace
                               // pléistocène (poussières, fabrique) : ~3× la loi de
                               // Glen propre. Standard modèles paléo (EISMINT, PISM,
                               // Paterson 1991). 1 = glace tempérée moderne pure.
const FLUX_UB_PLAT    = 50;    // m/an — SPÉCIFICATION (Eric) : vitesse de glissement
                               // « à plat » en régime ACTUEL. Au LGM : « certainement
                               // bien plus » — MONTER CETTE VALEUR pour calibrer
                               // l'avancée des lobes (juge : moraines).
const FLUX_PENTE_REF  = 0.01;  // pente de SURFACE du « plat » de référence : 1 % =
                               // pente mesurée des surfaces de lobes de piémont (le
                               // lit peut être à 0,00 % ou remontant — la démo « train »
                               // du 2026-07-15 : la poussée passe par l'épaisseur).
const FLUX_H_REF      = 200;   // m — épaisseur de référence de la spécification.
// Glissement till LINÉAIRE (u_b = c1·τ, Boulton & Hindmarsh 1987) DÉRIVÉ de la
// spec — u ∝ τ : 50 m/an à plat, ~500 m/an à 10 % de pente de surface. Pas
// d'explosion cubique (l'ancienne dérivation Weertman τ³ donnait ~50 km/an en
// couloir raide → sous-cyclage CFL par milliers → workers saturés, corrigé v3.66) :
const FLUX_C1 = (FLUX_UB_PLAT/(365*86400)) / (917*9.81*FLUX_H_REF*FLUX_PENTE_REF);
const GLAC_NJOURS   = Math.floor(360 / GLAC_PAS_J) + 1;        // 73 tranches de 5 j (jours 1,6,…,361)
const GLAC_PRECIP   = 1500;       // mm/an précipitations de base ACTUELLES (versant neutre)
const GLAC_PRECIP_CC = 0.045;     // /°C — précip × exp(CC·ΔT) : Clausius-Clapeyron tempérée
                                  // (capacité vapeur ~7 %/°C, précip effective ~4-5 %/°C).
                                  // Contrôle : ΔT=-13 °C (LGM) → ×0,56, dans les 50-70 % des
                                  // reconstructions alpines. ΔT=0 → ×1 (présent).
// ── ANCIENNES CONSTANTES FOEHN — retirées v3.62, remplacées par un calcul
// physique (dsm-foehn.js : thermodynamique adiabatique + Smith & Barstad
// 2004). Gardées en commentaire pour l'audit des constantes (traçabilité) :
//   GLAC_FOEHN_VENT = 1.33     × précip versant AU VENT   (~2000 mm/an)
//   GLAC_FOEHN_SOUS = 0.33     × précip versant SOUS LE VENT (~500 mm/an)
//   GLAC_FOEHN_DT   = 5.0      °C réchauffement foehn, plat
//   GLAC_FOEHN_GRAZE = 0.5     ° élévation rasante, seuil d'ombre pluvio
// Voir dsm-foehn-cadrage.md pour les équations et sources qui remplacent
// ces quatre valeurs inventées.
const GLAC_DENS_NEIGE = 0.1;      // densité neige fraîche (affichage : épaisseur/w.e.)
const GLAC_DENS_GLACE = 0.917;    // densité glace ρ=917 kg/m³ (unifiée — audit constantes)
const GLAC_TAU_TASS   = 10.0;     // ans — constante de temps tassement neige→glace (exponentiel)
const GLAC_K_TASS     = GLAC_PAS_J/365/GLAC_TAU_TASS;  // fraction convertie par pas (d/τ)
const GLAC_DDF_NEIGE  = 0.00017;  // m w.e./(°C·h) ≈ 4 mm w.e./°C·j (PDD neige)
const GLAC_DDF_GLACE  = 0.00033;  // m w.e./(°C·h) ≈ 8 mm w.e./°C·j (PDD glace)
// Réservoirs internes : TOUS en m ÉQUIVALENT EAU (w.e.), PAR TRIANGLE du filet.

// ── Filet : budget de triangles à rebours des workers ──
// budget = nWorkers × triangles/s/worker × délai cible (60 s/pas).
// FILET_TRI_S est calibrable (coût réel par triangle mesuré à l'usage).
const FILET_DELAI_S = 60;                                  // s par pas et par CPU
const FILET_TRI_S   = 500;                                 // triangles/s/worker (mesuré : <1 s/pas à 16k tri)
const FILET_WORKERS = (navigator.hardwareConcurrency || 4);
const FILET_BUDGET  = Math.min(131072, FILET_WORKERS * FILET_TRI_S * FILET_DELAI_S);
const FILET_JOUR_CHAUD = 60;                               // 1er mars : tri des zones chaudes

let glacierFilet  = null;   // objet DSMFILET (géométrie facettes)
let filetNeige    = null;   // Float32Array[nTri] neige (m w.e.) par triangle
let filetGlace    = null;   // Float32Array[nTri] glace (m w.e.) par triangle

let glacierOsc    = null;   // OffscreenCanvas overlay
// (réservoirs pixel supprimés v3.35 — accumulation par triangle du filet)
let glacierFoehnC = null;   // Float32Array[N] facteur précip foehn (1.33 vent / 0.33 sous-vent / 1 neutre)
let glacierFoehnDT = null;  // Float32Array[N] réchauffement foehn °C (sous le vent)
let glacierInsolCards = null; // Array[73] de Uint8Array[N] — insolation/jour normalisée 0..255
let glacierInsolMax = 0;      // max global (heures·éq-zénith) correspondant à 255
let glacierRunning = false;
let glacierTimer   = null;
let glacierStep    = 0;

// ── Rééchantillonnage elevGrid → 1024×1024 (si ombreElev1024 absent) ──
function glacierElev1024() {
  if (ombreElev1024) return ombreElev1024;
  var W=GLAC_DIM, H=GLAC_DIM, out=new Float32Array(GLAC_N);
  var sx=imgW/W, sy=imgH/H;   // convention surface (alignée sur le composite render)
  for(var rr=0;rr<H;rr++){
    var fy=rr*sy, iy=Math.min(Math.floor(fy),imgH-2), ty=fy-iy;
    for(var cc=0;cc<W;cc++){
      var fx=cc*sx, ix=Math.min(Math.floor(fx),imgW-2), tx=fx-ix;
      out[rr*W+cc]=
        elevGrid[ iy   *imgW+ix  ]*(1-tx)*(1-ty)+
        elevGrid[ iy   *imgW+ix+1]*   tx *(1-ty)+
        elevGrid[(iy+1)*imgW+ix  ]*(1-tx)*   ty +
        elevGrid[(iy+1)*imgW+ix+1]*   tx *   ty;
    }
  }
  return out;
}

// ── Normale COAGULÉE par pixel (window.dsmPixNorm) ──
// Pour chaque patch fusionné du maillage, moyenne des normales-GRADIENT (même
// convention que le worker insol) des pixels du patch ; rabattue par pixel.
// Tout pixel d'un même patch partage alors une seule pente/orientation.
// Convention worker : nx=-dz/dx, ny=-dz/dnord, nz=1 (resX par ligne, resY scalaire).
function dsmCalcPixNorm() {
  var m = window.dsmMesh;
  if (!m || !m.patch || typeof ombreElev1024==='undefined' || !ombreElev1024
      || typeof ombreResX==='undefined' || !ombreResX) { window.dsmPixNorm=null; return; }
  var D=GLAC_DIM, N=GLAC_N, e=ombreElev1024, rX=ombreResX, rY=ombreResY;
  function gradN(x,y,out){
    var i=y*D+x;
    var zE=x<D-1?e[i+1]:e[i], zW=x>0?e[i-1]:e[i];
    var dx=(x>0&&x<D-1)?(zE-zW)/(2*rX[y]):(zE-zW)/rX[y];
    var zN=y>0?e[i-D]:e[i], zS=y<D-1?e[i+D]:e[i];
    var dn=(y>0&&y<D-1)?(zN-zS)/(2*rY):(zN-zS)/rY;
    var nx=-dx, ny=-dn, L=Math.sqrt(nx*nx+ny*ny+1);
    out[0]=nx/L; out[1]=ny/L; out[2]=1/L;
  }
  var nP=m.nP, patch=m.patch, nT=m.nT, DM1=D-1;
  var pAcc=new Float32Array(nP*3), g=new Float32Array(3);
  // 1. accumuler la normale-gradient de chaque cellule dans son patch
  for(var cell=0; cell*2<nT; cell++){
    var p=patch[cell*2]*3, cx=cell%DM1, cy=(cell/DM1)|0;
    gradN(cx,cy,g); pAcc[p]+=g[0]; pAcc[p+1]+=g[1]; pAcc[p+2]+=g[2];
  }
  // 2. normaliser chaque patch
  for(var q=0;q<nP;q++){ var o=q*3, L=Math.sqrt(pAcc[o]*pAcc[o]+pAcc[o+1]*pAcc[o+1]+pAcc[o+2]*pAcc[o+2])||1;
    pAcc[o]/=L; pAcc[o+1]/=L; pAcc[o+2]/=L; }
  // 3. rabattre par pixel = normale du patch de sa cellule
  var pn=new Float32Array(N*3);
  for(var cell2=0; cell2*2<nT; cell2++){
    var p2=patch[cell2*2]*3, cx2=cell2%DM1, cy2=(cell2/DM1)|0, vi=(cy2*D+cx2)*3;
    pn[vi]=pAcc[p2]; pn[vi+1]=pAcc[p2+1]; pn[vi+2]=pAcc[p2+2];
  }
  // 4. pixels sans cellule (dernière ligne/colonne) : gradient direct
  for(var i2=0;i2<N;i2++){ var b=i2*3;
    if(pn[b]===0&&pn[b+1]===0&&pn[b+2]===0){ gradN(i2%D,(i2/D)|0,g); pn[b]=g[0];pn[b+1]=g[1];pn[b+2]=g[2]; } }
  window.dsmPixNorm=pn;
  console.log('[GLACIER] normales coagulées prêtes — '+nP+' patches');
}

// ── cos(θ) par pixel — projection horizontale de la normale ──
function glacierCalcCosTheta(elev1024) {
  var ct=new Float32Array(GLAC_N), D=GLAC_DIM;
  if(window.dsmPixNorm){                       // normale coagulée (patch) — préférée
    var pn=window.dsmPixNorm;
    for(var i=0;i<GLAC_N;i++) ct[i]=Math.abs(pn[i*3+2]);
  } else if(window.dsmMesh && window.dsmMesh.normals) {
    var nz=window.dsmMesh.normals, tris=window.dsmMesh.tris, nT=window.dsmMesh.nT;
    var cnt=new Uint8Array(GLAC_N);
    for(var t=0;t<nT;t++){
      var v=Math.abs(nz[t*3+2]);
      var a=tris[t*3],b=tris[t*3+1],cc2=tris[t*3+2];
      ct[a]+=v;cnt[a]++; ct[b]+=v;cnt[b]++; ct[cc2]+=v;cnt[cc2]++;
    }
    for(var i=0;i<GLAC_N;i++) ct[i]=cnt[i]?ct[i]/cnt[i]:0;
  } else {
    for(var y=0;y<D;y++) for(var x=0;x<D;x++){
      var i=y*D+x;
      var xm=x>0?elev1024[i-1]:elev1024[i], xp=x<D-1?elev1024[i+1]:elev1024[i];
      var ym=y>0?elev1024[i-D]:elev1024[i], yp=y<D-1?elev1024[i+D]:elev1024[i];
      var dzdx=(xp-xm)/20, dzdy=(yp-ym)/20;
      ct[i]=1/Math.sqrt(1+dzdx*dzdx+dzdy*dzdy);
    }
  }
  return ct;
}

// ── Cap du vent dominant selon latitude et époque ──
// Présent : 270° (ouest) partout. LGM : 225° (SO) dans la bande ±45°,
// puis retour progressif à l'ouest au-delà (fondu jusqu'au pôle).
// Force du régime g = anomalie polaire normalisée (0 présent → 1 LGM).
// PLUS APPELÉE depuis v3.62 — glacierCalcFoehn utilise désormais
// DsmFoehn.foehnWindDirection(t_ka) (270° présent → 202,5° SSO au LGM,
// valeurs données par l'utilisateur pour le nouveau module). Modèle
// différent de celui-ci (270°→225° SO, pondéré latitude+anomalie
// polaire) : gardée pour référence/audit, à supprimer si confirmé inutile
// ailleurs.
function capVent(latDeg, t_ka) {
  var aLGM = anomaliePaleo(-20, 70);                 // référence pleine (≈ -20)
  var g    = aLGM ? anomaliePaleo(t_ka, 70) / aLGM : 0;   // 0 présent → 1 LGM
  if(g<0) g=0; if(g>1) g=1;
  var la = Math.abs(latDeg);
  var w  = la <= 45 ? 1 : Math.max(0, (90 - la) / 45);    // 1 sous 45°, →0 au pôle
  return 270 - 45 * g * w;                                // 270 présent → 225 LGM tropical
}

// ── Foehn par pixel — calcul physique (dsm-foehn.js) ──
// Remplace l'ancien test binaire par azimut (GLAC_FOEHN_GRAZE) par :
//   fC  : précipitation orographique Smith & Barstad (2004), continue
//   fDT : réchauffement adiabatique réel (Γ_sec−Γ_humide)×Δz_saturé
// Température utilisée pour Γ_humide et le LCL : profil annuel moyen
// T(z) = TEMP_T0_MER + anomaliePaleo(t_ka,lat) − TEMP_LAPSE·z/1000, cohérent
// avec le pas de recalcul du foehn (5 ka) — pas la diurne instantanée,
// qui reste ajoutée séparément dans glacierAccumPas (C = tempInstant(...)+fDT).
// Pas de fallback : si l'horizon n'est pas prêt, DSMFOEHN n'en a pas besoin
// (recherche de crête directe sur ombreElev1024), mais on garde le garde-fou
// existant car le reste de l'init en dépend.
function glacierCalcFoehn(t_ka) {
  if(!ombreHorizonCopy)
    throw new Error('Foehn impossible : horizon non calculé — lancer l\'étape Ombre avant Glacier.');
  var lat = (GEO.latMax + GEO.latMin) / 2;
  var tempFn = function(idx) {
    return TEMP_T0_MER + anomaliePaleo(t_ka, lat) - TEMP_LAPSE * ombreElev1024[idx] / 1000;
  };
  var out = DsmFoehn.foehnCalc(t_ka, ombreElev1024, ombreResY, lat, tempFn);
  glacierFoehnDT = out.foehnDT;
  return out.foehnC;
}

// ── Pas d'accumulation (5 jours) — PAR TRIANGLE du filet ──
// jour : jour julien 1-365 du milieu du pas ; t_ka : époque en ka.
// Chaque triangle actif : T au centroïde (tempInstant sur le pixel centroïde),
// cos θ = normale du triangle, foehn/insolation échantillonnés au centroïde.
function glacierAccumPas(elev1024, jour, t_ka) {
  var orb   = orbital(t_ka);
  var pibar = orb.pib + Math.PI;
  var lat   = (GEO.latMax+GEO.latMin)/2;
  var lon   = (GEO.lonMax+GEO.lonMin)/2;
  var rh    = sunRiseSet(jour, orb.e, orb.eps, pibar, lat*Math.PI/180, lon);
  var rise  = rh&&rh.rise>=0 ? rh.rise : 12, setH = rh&&rh.rise>=0 ? rh.set : 12;
  var L     = Math.max(0, setH-rise);              // durée du jour (h)

  var precJour=(GLAC_PRECIP/1000)*GLAC_PAS_J/365
               *Math.exp(GLAC_PRECIP_CC*anomaliePaleo(t_ka,(GEO.latMax+GEO.latMin)/2));  // m eau/pas × facteur paléo (C-C)
  var slice = Math.min(GLAC_NJOURS-1, Math.floor((jour-1)/GLAC_PAS_J));
  var card  = glacierInsolCards[slice];

  var F = glacierFilet;
  for(var t=0; t<F.nTri; t++) {
    if(!F.actif[t] && filetGlace[t]<=0 && filetNeige[t]<=0) continue;
    var ic = F.centIdx[t];
    var fDT = glacierFoehnDT[ic];
    // T constante hors diurne (nuit comprise) + amplitude diurne
    var C = tempInstant(ic, -1, jour, t_ka, rise, setH, false) + fDT;
    var b = TEMP_A_DIURNE * nebJour(jour) * (card[ic]/255);

    // PDD analytique 24 h (°C·h) — diurne CENTRÉ (parité worker-glacier 1.5) :
    // C = MOYENNE journalière ; nuit = C−m, jour = C−m+b·sin, m = (2b/π)·(L/24).
    var mC = (L>0 && b>0) ? (2*b/Math.PI)*(L/24) : 0;
    var Cn = C - mC;
    var degH = (Cn>0 ? Cn*(24-L) : 0);
    if (L>0 && b>0) {
      if (Cn>=0)          degH += (Cn + 2*b/Math.PI) * L;
      else if (Cn+b>0) {
        var f1 = Math.asin(-Cn/b)/Math.PI;
        degH += (Cn*(1-2*f1) + (2*b/Math.PI)*Math.cos(Math.PI*f1)) * L;
      }
    } else if (L>0 && Cn>0) degH += Cn*L;

    // 1. Dépôt (m w.e.) : fraction neige sur T nocturne = C
    var precEff = precJour * F.cosT[t] * glacierFoehnC[ic];
    var fSnow = C <= 0 ? 1 : (C < 2 ? (2-C)/2 : 0);
    filetNeige[t] += precEff * fSnow;

    // 2. Fonte PDD : degrés-heures/jour × 5 j
    var dh = degH * GLAC_PAS_J;
    if(dh > 0) {
      var fN = dh * GLAC_DDF_NEIGE;
      if(fN <= filetNeige[t]) {
        filetNeige[t] -= fN;
      } else {
        var dhReste = (fN - filetNeige[t]) / GLAC_DDF_NEIGE;
        filetNeige[t] = 0;
        filetGlace[t] = Math.max(0, filetGlace[t] - dhReste * GLAC_DDF_GLACE);
      }
    }

    // 3. Tassement continu neige → glace (exponentiel τ=10 ans), 1:1 en w.e.
    if(filetNeige[t] > 0) {
      var conv = filetNeige[t] * GLAC_K_TASS;
      filetNeige[t] -= conv;
      filetGlace[t] += conv;
    }
  }
}

// ── 8. Affichage déciles cyan(neige)/bleu(glace) ──
function glacierDessiner(elev1024) {
  if(!glacierOsc) glacierOsc=new OffscreenCanvas(GLAC_DIM,GLAC_DIM);
  var ctx2=glacierOsc.getContext('2d');
  var imgd=ctx2.createImageData(GLAC_DIM,GLAC_DIM);
  var d=imgd.data;
  var F=glacierFilet, top=F.triOfPix;

  // Déciles sur les TRIANGLES couverts (épaisseur totale)
  var vals=[];
  for(var t=0;t<F.nTri;t++){
    if(!F.actif[t]) continue;
    var tot=filetNeige[t]/GLAC_DENS_NEIGE+filetGlace[t]/GLAC_DENS_GLACE;
    if(tot>0.01) vals.push(tot);
  }
  vals.sort(function(a,b){return a-b;});
  var nv=vals.length;
  var deciles=new Float32Array(11);
  for(var d2=0;d2<=10;d2++) deciles[d2]=nv>0?vals[Math.min(nv-1,Math.round(d2/10*(nv-1)))]:0;

  // Peinture par pixel via lookup triOfPix
  for(var i=0;i<GLAC_N;i++){
    var ti=top[i];
    if(ti<0||!F.actif[ti]) continue;
    var neige=filetNeige[ti]/GLAC_DENS_NEIGE, glace=filetGlace[ti]/GLAC_DENS_GLACE, total=neige+glace;
    if(total<0.01) continue;
    var dec=0;
    for(var k=1;k<=10;k++) if(total>=deciles[k]) dec=k;
    var tt=dec/10;   // 0=fin, 1=épais
    var p=i<<2;
    if(filetGlace[ti]>filetNeige[ti]){   // décision en w.e.
      d[p]  =0;
      d[p+1]=Math.round(20+tt*100);
      d[p+2]=Math.round(120+tt*135);
    } else {
      d[p]  =Math.round(100-tt*100);
      d[p+1]=Math.round(200+tt*55);
      d[p+2]=255;
    }
    d[p+3]=Math.round(150+tt*105);
  }
  ctx2.putImageData(imgd,0,0);
  // Ligne de front extension max — TOUJOURS visible, rouge net 3 px
  if(window._glacExtMax){
    var ext=window._glacExtMax, W=GLAC_DIM;
    var m=new Uint8Array(W*W);
    for(var i2=0;i2<W*W;i2++){ var ti2=top[i2]; if(ti2>=0&&ext[ti2]) m[i2]=1; }
    ctx2.fillStyle='#ff0000';
    for(var y2=1;y2<W-1;y2++)
      for(var x2=1;x2<W-1;x2++){
        var i3=y2*W+x2;
        if(!m[i3]) continue;
        if(!m[i3-1]||!m[i3+1]||!m[i3-W]||!m[i3+W]) ctx2.fillRect(x2,y2,1,1);
      }
  }
  render();
}

// ── Boucle asynchrone par requestAnimationFrame ──
// Climat FIGÉ au LGM (phase 1 init) : t_ka constant, insolation déjà précalculée
// (73 cartes). La boucle ne fait QUE consommer les caches — aucun worker relancé.
// ── Stats par triangle : % surface couverte, moyennes pondérées surface, max ──
function glacierStats() {
  var F=glacierFilet, sCov=0, sTot=0, sN=0, sG=0, mxG=0;
  for(var t=0;t<F.nTri;t++){
    if(!F.actif[t]) continue;
    var a=F.surf[t]; sTot+=a;
    var w=filetNeige[t]+filetGlace[t];
    if(w>0.001){ sCov+=a; sN+=filetNeige[t]*a; sG+=filetGlace[t]*a; if(filetGlace[t]>mxG) mxG=filetGlace[t]; }
  }
  var kmCur=0, kmMax=0;
  for(var t2=0;t2<F.nTri;t2++){
    if(filetGlace[t2]>1) kmCur+=F.surf[t2];      // front : glace ≥ 1 m w.e. (le film de tassement < 1 m n’est pas un glacier)
    if(window._glacExtMax && window._glacExtMax[t2]) kmMax+=F.surf[t2];
  }
  return { pcCov:(sTot?100*sCov/sTot:0).toFixed(1),
           mN: sCov?(sN/sCov/GLAC_DENS_NEIGE):0,
           mG: sCov?(sG/sCov/GLAC_DENS_GLACE):0,
           mxG: mxG/GLAC_DENS_GLACE,
           kmCur: kmCur/1e6, kmMax: kmMax/1e6 };   // km² glaciés (actuel, extension max)
}

// ── BILAN DE MASSE / ELA (v3.58) : table annuelle par tranches de 100 m ──
// Affiche accumulation, fonte et bilan net (m w.e./an, moyennes surfaciques)
// du cumul en cours, puis l'ELA du modèle : passage à zéro du bilan net
// (interpolation linéaire entre les deux tranches qui encadrent le zéro).
// Appelable à tout moment en console : bilanELA()
window.bilanELA = function () {
  if (!window._elaPos) { console.log('bilanELA : lancer Glacier d\'abord'); return; }
  var anB = Math.floor(glacierStep * GLAC_PAS_J / 365);
  console.log('[ELA] bilan de masse — année simulée ' + anB +
              ' (cible LGM : ELA 1000–1400 m)');
  console.log('  tranche      | accum. | fonte  | net (m w.e./an)');
  var zN = [], bN = [];
  for (var b = 59; b >= 0; b--) {
    var A = window._elaAire[b]; if (A <= 0) continue;
    var acc = window._elaPos[b] / A, abl = window._elaNeg[b] / A;
    var net = acc - abl;
    zN.push(b * 100 + 50); bN.push(net);
    console.log('  ' + (b * 100) + '\u2013' + (b * 100 + 100) + ' m | ' +
      acc.toFixed(2).padStart(6) + ' | ' + abl.toFixed(2).padStart(6) + ' | ' +
      (net >= 0 ? '+' : '') + net.toFixed(2));
  }
  // ELA : premier passage + → − en descendant (zN est trié décroissant)
  var ela = null;
  for (var i = 0; i < zN.length - 1; i++)
    if (bN[i] > 0 && bN[i + 1] <= 0) {
      ela = zN[i + 1] + 100 * bN[i + 1] / (bN[i + 1] - bN[i]); break;
    }
  if (ela !== null) console.log('[ELA] modèle \u2248 ' + Math.round(ela) +
    ' m — écart cible : ' + Math.round(ela - 1400) + ' m au-dessus de 1400 m');
  else if (bN.length && bN[0] <= 0) console.log('[ELA] modèle : bilan négatif ' +
    'jusqu\'aux sommets — ELA au-dessus du relief');
  else console.log('[ELA] modèle : pas de passage à zéro (bilan positif partout ?)');
};

// ── Tables par triangle pour le pool (échantillonnage aux centroïdes) ──
function glacierTablesWsun(){
  var F=glacierFilet, n=F.nTri, w=new Uint8Array(GLAC_NJOURS*n);
  for(var sl=0; sl<GLAC_NJOURS; sl++){
    var c=glacierInsolCards[sl], o=sl*n;
    for(var t=0;t<n;t++) w[o+t]=c[F.centIdx[t]];
  }
  return w;
}
function glacierPoolInit(){
  var F=glacierFilet, n=F.nTri;
  var z=new Float32Array(n), fC=new Float32Array(n), fDT=new Float32Array(n);
  for(var t=0;t<n;t++){ var ic=F.centIdx[t];
    z[t]=ombreElev1024[ic]; fC[t]=glacierFoehnC[ic]; fDT[t]=glacierFoehnDT[ic]; }
  return GLACPOOL.init(n, { z:z, fDT:fDT, fC:fC, cosT:F.cosT, actif:F.actif,
    wSun73:glacierTablesWsun(),
    K:{ lapse:TEMP_LAPSE, aDiurne:TEMP_A_DIURNE, pasJ:GLAC_PAS_J,
        ddfN:GLAC_DDF_NEIGE, ddfG:GLAC_DDF_GLACE, kTass:GLAC_K_TASS } });
}
function glacierPoolFoehn(){
  var F=glacierFilet, n=F.nTri, fC=new Float32Array(n), fDT=new Float32Array(n);
  for(var t=0;t<n;t++){ var ic=F.centIdx[t]; fC[t]=glacierFoehnC[ic]; fDT[t]=glacierFoehnDT[ic]; }
  return GLACPOOL.majFoehn(fC, fDT);
}

function glacierLoop(elev1024) {
  if(!glacierRunning){ console.log('[GLACIER] boucle arrêtée'); return; }
  if(glacierStep>=GLAC_NSTEPS_TOT){
    glacierRunning=false;
    var st=glacierStats();
    var _dt=((performance.now()-window._glacT0)/1000).toFixed(1);
    var msg='❄️ TERMINÉ '+GLAC_NSTEPS_TOT+' pas (10 ans LGM + '+GLAC_CYCLE_ANS+' cycles → 2026) en '+_dt+' s ('+
            (window._glacTAccum/GLAC_NSTEPS_TOT).toFixed(0)+' ms/pas calcul) | couvert '+st.pcCov+'% | moy neige '
            +st.mN.toFixed(1)+'m | moy glace '+st.mG.toFixed(2)+'m | max glace '+st.mxG.toFixed(1)+'m | ext '+st.kmCur.toFixed(1)+'/'+st.kmMax.toFixed(1)+' km²';
    document.getElementById('vstatus').textContent=msg;
    document.getElementById('btn-glacier').textContent='❄️ Glacier';
    document.getElementById('btn-glacier').classList.remove('active');
    console.log('[GLACIER] FIN BOUCLE —',msg);
    glacierDessiner(elev1024); if(fluxActif) fluxDessiner();
    return;
  }
  var jour=((glacierStep*GLAC_PAS_J)%365)+1;
  // Phase 1 : climat figé LGM. Phase 2 : t_ka balaye LGM → 2026.
  var t_ka;
  if(glacierStep < GLAC_NSTEPS) t_ka = GLAC_EPOQUE_INIT;
  else t_ka = GLAC_EPOQUE_INIT + ((glacierStep-GLAC_NSTEPS)/GLAC_NJOURS)*GLAC_KA_PAR_AN;
  deltaCmarqueur(t_ka);   // point rouge : position temporelle sur la courbe ΔT
  // Insolation : précession — recalcul des 73 cartes tous les 1 ka (pause boucle)
  if(glacierStep >= GLAC_NSTEPS){
    var _insBin = Math.floor(t_ka - GLAC_EPOQUE_INIT);
    if(window._glacInsBin === undefined) window._glacInsBin = 0;
    if(_insBin !== window._glacInsBin){
      window._glacInsBin = _insBin;
      console.log('[GLACIER] recalcul insolation (précession) à t_ka='+t_ka.toFixed(2));
      var _st=glacierStep;
      glacierPrechargeInsol(t_ka)
        .then(function(){ return GLACPOOL.majSoleil(glacierTablesWsun()); })
        .then(function(){
          if(glacierRunning) requestAnimationFrame(function(){ glacierLoop(elev1024); });
        });
      glacierStep=_st;  // la boucle reprendra au même pas après le rechargement
      return;           // pause : pas de pas pendant le recalcul
    }
  }
  // Foehn : capVent(lat, t_ka) évolue — recalcul tous les GLAC_FOEHN_RECALC_KA ka
  if(glacierStep >= GLAC_NSTEPS){
    var _kaBin = Math.floor((t_ka - GLAC_EPOQUE_INIT) / GLAC_FOEHN_RECALC_KA);
    if(window._glacFoehnBin === undefined) window._glacFoehnBin = 0;
    if(_kaBin !== window._glacFoehnBin){
      window._glacFoehnBin = _kaBin;
      console.log('[GLACIER] recalcul foehn à t_ka='+t_ka.toFixed(1));
      glacierFoehnC = glacierCalcFoehn(t_ka);
      glacierPoolFoehn();
    }
  }
  if(glacierStep===0){
    window._glacT0=performance.now(); window._glacTAccum=0;
    console.log('[GLACIER] DÉBUT — climat figé t_ka='+t_ka+' | '+GLAC_NSTEPS+' pas de '+GLAC_PAS_J+'j ('+GLAC_ANS+' ans)');
  }

  var _tp=performance.now();
  // Scalaires du pas (le pool fait le par-triangle ; physique identique)
  var orbP=orbital(t_ka), pibarP=orbP.pib+Math.PI;
  var latP=(GEO.latMax+GEO.latMin)/2, lonP=(GEO.lonMax+GEO.lonMin)/2;
  var rhP=sunRiseSet(jour, orbP.e, orbP.eps, pibarP, latP*Math.PI/180, lonP);
  var riseP=rhP&&rhP.rise>=0?rhP.rise:12, setP=rhP&&rhP.rise>=0?rhP.set:12;
  var scal={ tMer:TEMP_T0_MER+anomaliePaleo(t_ka,latP), bNeb:nebJour(jour), 
             tSaison:TEMP_A_SAISON*Math.cos(2*Math.PI*(jour-TEMP_JOUR_ETE)/365),
             L:Math.max(0,setP-riseP),
             precJour:(GLAC_PRECIP/1000)*GLAC_PAS_J/365*Math.exp(GLAC_PRECIP_CC*anomaliePaleo(t_ka,latP)),
             slice:Math.min(GLAC_NJOURS-1,Math.floor((jour-1)/GLAC_PAS_J)) };
  // ── BILAN DE MASSE / ELA (v3.58) : photo de (neige+glace) AVANT le pas
  // climatique — la différence après GLACPOOL.pas est le bilan du pas
  // (précipitation − fonte), le transport du flux n'y entre pas.
  if (!window._elaAvant) {
    var _nT0 = glacierFilet.nTri;
    window._elaAvant = new Float32Array(_nT0);
    window._elaBand  = new Int16Array(_nT0);          // tranche de 100 m par triangle
    window._elaAire  = new Float64Array(60);          // aire par tranche (m², statique)
    for (var _e0 = 0; _e0 < _nT0; _e0++) {
      var _b0 = Math.max(0, Math.min(59, glacierFilet.centZ[_e0] / 100 | 0));
      window._elaBand[_e0] = _b0;
      window._elaAire[_b0] += glacierFilet.surf[_e0];
    }
    window._elaPos = new Float64Array(60);            // accumulation de l'année (m³ w.e.)
    window._elaNeg = new Float64Array(60);            // fonte de l'année (m³ w.e.)
  }
  for (var _e1 = 0; _e1 < glacierFilet.nTri; _e1++)
    window._elaAvant[_e1] = filetNeige[_e1] + filetGlace[_e1];
GLACPOOL.pas(scal, filetNeige, filetGlace).then(function(){
  // ── BILAN DE MASSE / ELA : différence du pas, cumul annuel par tranche ──
  for (var _e2 = 0; _e2 < glacierFilet.nTri; _e2++) {
    var _d = filetNeige[_e2] + filetGlace[_e2] - window._elaAvant[_e2];
    if (_d > 0) window._elaPos[window._elaBand[_e2]] += _d * glacierFilet.surf[_e2];
    else if (_d < 0) window._elaNeg[window._elaBand[_e2]] -= _d * glacierFilet.surf[_e2];
  }
  if (glacierStep % GLAC_NJOURS === GLAC_NJOURS - 1) {       // année bouclée
    var _anB = Math.floor(glacierStep * GLAC_PAS_J / 365);
    if (_anB < 10 || _anB % 50 === 0) window.bilanELA();
    window._elaPos.fill(0); window._elaNeg.fill(0);
  }
// Écoulement : fil principal (transferts inter-triangles)
  var _fluxPrep = window._glacAdj ? Promise.resolve() : (function(){
  
window._glacAdj = DSMFLUX.adjacence(glacierFilet, ombreResY, FLUX_PENTE_MODE);

  return FLUXWORKER.init(glacierFilet, window._glacAdj, { E: FLUX_E_GLEN, c1: FLUX_C1 });
  })();
  var _vAv=0; for(var _q=0;_q<glacierFilet.nTri;_q++) _vAv+=filetGlace[_q]*glacierFilet.surf[_q];
  _fluxPrep.then(function(){ return FLUXWORKER.pas(glacierFilet, filetGlace, GLAC_PAS_J); }).then(function(){
  var _vAp=0,_dep=0;
  for(var _q2=0;_q2<glacierFilet.nTri;_q2++){ _vAp+=filetGlace[_q2]*glacierFilet.surf[_q2];
    _dep+=Math.abs(glacierFilet.vit[_q2])>0?1:0; }
  window._glacVolDep=(window._glacVolDep||0); window._glacVolErr=_vAp-_vAv; window._glacNbFlux=_dep;
  // Extension maxi : masque des triangles ayant porté de la glace
  if(!window._glacExtMax) window._glacExtMax = new Uint8Array(glacierFilet.nTri);
  for(var _t=0;_t<glacierFilet.nTri;_t++) if(filetGlace[_t]>1) window._glacExtMax[_t]=1;

  window._glacTAccum+=performance.now()-_tp;

  if(glacierStep%(GLAC_NJOURS*50)===0){   // affichage tous les 50 ans simulés
    var st=glacierStats();
    var anSim=Math.floor(glacierStep*GLAC_PAS_J/365);
    
var phase = (glacierStep<GLAC_NSTEPS ? 'LGM' : 't_ka '+t_ka.toFixed(2))+
                ' | iso0 '+Math.round((TEMP_T0_MER+anomaliePaleo(t_ka,latP))*1000/TEMP_LAPSE)+'m';

var msg='[GLACIER] pas '+glacierStep+'/'+GLAC_NSTEPS_TOT+' ('+phase+
            ') | ext '+st.kmCur.toFixed(1)+'/'+st.kmMax.toFixed(1)+' km² | flux '+(window._glacNbFlux||0)+' tri | ΔV '+((window._glacVolErr||0)/1e6).toFixed(2)+' Mm³ | moy neige '+st.mN.toFixed(1)+
            'm | moy glace '+st.mG.toFixed(2)+'m | max glace '+st.mxG.toFixed(1)+'m | '+
            (window._glacTAccum/(glacierStep+1)).toFixed(0)+' ms/pas';
    console.log(msg);
    if(DSMFLUX.sonde) console.log('[SONDE]', JSON.stringify(DSMFLUX.sonde.top), 'nég:', DSMFLUX.sonde.neg);
    document.getElementById('vstatus').textContent='❄️ '+phase+
      ' | ext '+st.kmCur.toFixed(1)+'/'+st.kmMax.toFixed(1)+' km² | glace '+st.mG.toFixed(2)+'m';
    glacierDessiner(elev1024); if(fluxActif) fluxDessiner();
  }
  glacierStep++;
  glacierLoop(elev1024);           // enchaînement direct
  });  // fin FLUXWORKER.pas.then
  });  // fin GLACPOOL.pas.then
}

// ── Init et démarrage ──
function glacierInit() {
  console.log('[GLACIER] glacierInit() — elevGrid='+!!elevGrid+' GEO='+!!GEO+' ombreHorizonCopy='+!!ombreHorizonCopy);
  if(!elevGrid||!GEO){
    console.error('[GLACIER] STOP — pas de tuile chargée');
    document.getElementById('vstatus').textContent='❄️ Charger une tuile d\'abord'; return;
  }
  // Reset caches inter-runs (BUG : adjacence de l'ancien filet → téléportation de masse)
  window._glacAdj=null; window._glacExtMax=null;
  window._glacInsBin=undefined; window._glacFoehnBin=undefined;
  console.log('[GLACIER] rééchantillonnage elev1024…');
  var elev1024=glacierElev1024();
  glacierStep  =0;
  glacierRunning=true;

  // Étapes exigeant les horizons : partage→filet→foehn→cartes→boucle.
  function _demarrer(){
    try {
      // Ligne de partage (pour la coupe des mailles sur crête)
      if(!window.dsmPartage){
        if(typeof DSMPARTAGE==='undefined')
          throw new Error('Partage indisponible');
        console.log('[GLACIER] partage des eaux…');
        window.dsmPartage=DSMPARTAGE.tracer(ombreElev1024);
      }
      // Foehn AVANT le filet (échantillonné aux centroïdes ensuite)
      glacierFoehnC = glacierCalcFoehn(GLAC_EPOQUE_INIT);
      // FILET : réutilisé si déjà construit (bouton Fil), sinon budget à rebours des workers
      if(window.dsmFilet){
        console.log('[GLACIER] filet existant réutilisé ('+window.dsmFilet.nTri+' triangles)');
        glacierFilet = window.dsmFilet;
      } else {
      console.log('[GLACIER] filet — budget '+FILET_BUDGET+' triangles ('+FILET_WORKERS+' workers × '+
                  FILET_TRI_S+' tri/s × '+FILET_DELAI_S+' s)…');
      var orb0=orbital(GLAC_EPOQUE_INIT), pibar0=orb0.pib+Math.PI;
      var lat0=(GEO.latMax+GEO.latMin)/2, lon0=(GEO.lonMax+GEO.lonMin)/2;
      var rh0=sunRiseSet(FILET_JOUR_CHAUD, orb0.e, orb0.eps, pibar0, lat0*Math.PI/180, lon0);
      var r0=rh0?rh0.rise:6, s0=rh0?rh0.set:18;
      glacierFilet = DSMFILET.construire(elev1024, window.dsmPartage, {
        budget: FILET_BUDGET, scaleXY: ombreResY,
        estChaud: function(idx, zc){
          // T moyenne (sans diurne) au 1er mars, époque initiale, foehn inclus
          return tempInstant(idx, -1, FILET_JOUR_CHAUD, GLAC_EPOQUE_INIT, r0, s0, false)
                 + glacierFoehnDT[idx] > 0;
        }
      });
      var _fs=DSMFILET.stats(glacierFilet);
      console.log('[FILET] triangles:', _fs.triangles, '| actifs (froids):', _fs.actifs,
                  '| mailles:', _fs.mailles, '| maille init:', _fs.mailleInit,
                  '| σ moy:', _fs.sigmaMoy);
      window.dsmFilet = glacierFilet;   // pour le bouton Fil
      }
      filetNeige = new Float32Array(glacierFilet.nTri);
      filetGlace = new Float32Array(glacierFilet.nTri);
    } catch(e){
      console.error('[GLACIER] STOP —', e.message);
      document.getElementById('vstatus').textContent='❄️ '+e.message;
      glacierRunning=false; return;
    }
    document.getElementById('vstatus').textContent='❄️ Précalcul des 73 cartes d\'insolation (LGM)…';
    glacierPrechargeInsol(GLAC_EPOQUE_INIT).then(function(){
      if(!glacierRunning) return;
      glacierStep=0;
      console.log('[GLACIER] 73 cartes prêtes → init pool ('+GLACPOOL.NW+' workers)');
      glacierPoolInit().then(function(){
        console.log('[GLACIER] pool prêt → démarrage boucle');
        requestAnimationFrame(function(){glacierLoop(elev1024);});
      });
    }).catch(function(err){
      console.error('[GLACIER] STOP précalcul insolation :', err.message);
      document.getElementById('vstatus').textContent='❄️ Erreur insolation : '+err.message;
      glacierRunning=false;
    });
  }

  if(!ombreHorizonCopy){
    console.log('[GLACIER] horizons absents → lancerOmbre() automatique');
    document.getElementById('vstatus').textContent='❄️ Calcul horizons terrain (passe 1)…';
    lancerOmbre();
    var _poll=setInterval(function(){
      if(!glacierRunning){ clearInterval(_poll); return; }
      if(ombreHorizonCopy){ clearInterval(_poll); console.log('[GLACIER] horizons prêts'); _demarrer(); }
    },1000);
  } else {
    console.log('[GLACIER] horizons disponibles');
    _demarrer();
  }
}

// ── Précalcul des 73 cartes d'insolation (une par tranche de 5 j), époque figée ──
// Normalisation Uint8 sur un MAX GLOBAL (préserve l'intensité saison à saison).
// Max estimé sur les deux solstices (bornes hautes), puis chaque carte quantifiée
// au vol → une seule carte Float32 en mémoire à la fois (~73 Mo de Uint8 au total).
function glacierPrechargeInsol(t_ka){
  glacierInsolCards = new Array(GLAC_NJOURS);
  // 1) Borne haute : max sur les deux solstices (jours 172 et 355), marge ×1,05
  return Promise.all([insolationJour(t_ka,172), insolationJour(t_ka,355)]).then(function(sols){
    var mx=0;
    for(var s=0;s<sols.length;s++){ var c=sols[s]; for(var i=0;i<c.length;i++) if(c[i]>mx) mx=c[i]; }
    glacierInsolMax = mx>0 ? mx*1.05 : 1;
    // 2) Construire et quantifier les 73 cartes en séquence
    var p = Promise.resolve();
    for(var s2=0; s2<GLAC_NJOURS; s2++){
      (function(slice){
        p = p.then(function(){
          if(!glacierRunning) return;
          var jour = 1 + slice*GLAC_PAS_J;          // 1,6,…,361
          return insolationJour(t_ka, jour).then(function(carte){
            var q = new Uint8Array(GLAC_N), inv = 255/glacierInsolMax;
            for(var i=0;i<GLAC_N;i++){ var v=carte[i]*inv; q[i] = v>255?255:(v<0?0:v); }
            glacierInsolCards[slice] = q;
            document.getElementById('vstatus').textContent =
              '❄️ Insolation tranche '+(slice+1)+'/'+GLAC_NJOURS+'…';
          });
        });
      })(s2);
    }
    return p;
  });
}

// ── Micro-courbe ΔT : spline paléo du forage + 7 points (validation visuelle) ──
// Sans interprétation latitude : on trace la table du forage de l'hémisphère de
// la carte (NORD si lat≥0, SUD sinon). X = -20 ka (gauche) → +2 ka (droite),
// Y = min/max de l'anomalie. Les 7 points sont pointés à LEUR valeur exacte :
// d'un coup d'œil on voit si la spline passe bien par eux et si la rechute YD est là.
// La valeur brute du forage = anomaliePaleo(t, lat_forage) (fondu = 1 au forage).
var _deltaCTrace = null;     // signe d'hémisphère déjà tracé (évite redessin)
var _deltaCFond = null;      // fond capturé (courbe+points) pour le marqueur temps
var _deltaCGeo  = null;      // géométrie du tracé (axes) pour placer le marqueur
function dessinerDeltaC() {
  var cv = document.getElementById('deltaC');
  if(!cv || typeof GEO==='undefined' || !GEO || typeof anomaliePaleo!=='function') return;
  var lat = (GEO.latMax + GEO.latMin) / 2;
  var nord = lat >= 0;
  if(_deltaCTrace === nord) return;     // déjà tracé pour cet hémisphère
  _deltaCTrace = nord;

  var forage = nord ? 70 : -78;         // latitude du forage (GRIP / Vostok)
  var nom    = nord ? 'GRIP 70°N' : 'Vostok 78°S';
  var table  = nord ? (typeof TEMP_PALEO_NORD!=='undefined'?TEMP_PALEO_NORD:null)
                    : (typeof TEMP_PALEO_SUD !=='undefined'?TEMP_PALEO_SUD :null);
  var TKA_MIN=GLAC_EPOQUE_INIT, TKA_MAX=2; // axe temps en ka (couvre le départ pré-LGM)
  var W=cv.width, H=cv.height, ctx=cv.getContext('2d');
  var PADL=4, PADR=4, PADT=4, PADB=4;
  ctx.clearRect(0,0,W,H);

  // Échantillonnage de la spline brute du forage
  var nS=W, ys=new Float32Array(nS), mn=Infinity, mx=-Infinity;
  for(var k=0;k<nS;k++){
    var t = TKA_MIN + k/(nS-1)*(TKA_MAX-TKA_MIN);
    var v = anomaliePaleo(t, forage);
    ys[k]=v; if(v<mn)mn=v; if(v>mx)mx=v;
  }
  if(mx-mn < 0.5){ mx+=0.5; mn-=0.5; }
  var pad=(mx-mn)*0.10; mn-=pad; mx+=pad;
  function xPix(t){ return PADL + (t-TKA_MIN)/(TKA_MAX-TKA_MIN)*(W-PADL-PADR); }
  function yPix(v){ return H-PADB - (v-mn)/(mx-mn)*(H-PADT-PADB); }

  // Grille : 0 °C (pointillé) + verticale présent (t=0)
  ctx.lineWidth=1;
  if(0>=mn && 0<=mx){
    ctx.strokeStyle='#45475a'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(PADL,yPix(0)); ctx.lineTo(W-PADR,yPix(0)); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.strokeStyle='#313244';
  ctx.beginPath(); ctx.moveTo(xPix(0),PADT); ctx.lineTo(xPix(0),H-PADB); ctx.stroke();

  // Spline
  ctx.strokeStyle='#89dceb'; ctx.lineWidth=2; ctx.beginPath();
  for(var k2=0;k2<nS;k2++){ var x=xPix(TKA_MIN+k2/(nS-1)*(TKA_MAX-TKA_MIN)), y=yPix(ys[k2]);
    if(k2===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.stroke();

  // Les 7 points à leur place exacte
  if(table){
    ctx.fillStyle='#f9e2af';
    for(var p=0;p<table.length;p++){
      var tp=table[p].t; if(tp<TKA_MIN||tp>TKA_MAX) continue;
      var px=xPix(tp), py=yPix(table[p].dT);
      ctx.beginPath(); ctx.arc(px,py,2.4,0,2*Math.PI); ctx.fill();
    }
  }

  // Repères texte : bornes X et min/max Y
  ctx.fillStyle='#585b70'; ctx.font='9px sans-serif';
  ctx.textBaseline='bottom'; ctx.fillText('-20ka', PADL+1, H-1);
  ctx.textAlign='right';     ctx.fillText('+2', W-PADR, H-1); ctx.textAlign='left';

  document.getElementById('deltaC-titre').textContent =
    'ΔT '+nom+' — '+mx.toFixed(0)+'…'+mn.toFixed(0)+'°C';

  // Capture pour le marqueur temps (point rouge) : fond + géométrie des axes
  _deltaCFond = ctx.getImageData(0,0,W,H);
  _deltaCGeo  = { forage:forage, TKA_MIN:TKA_MIN, TKA_MAX:TKA_MAX, mn:mn, mx:mx,
                  PADL:PADL, PADR:PADR, PADT:PADT, PADB:PADB, W:W, H:H };
}

// ── Marqueur temps : point rouge qui parcourt la courbe ΔT à t_ka courant ──
// Restaure le fond capturé puis pointe (t_ka, anomaliePaleo(t_ka, forage)) —
// le point roule SUR la courbe tracée. Appelé à chaque pas de la simulation.
function deltaCmarqueur(t){
  var cv=document.getElementById('deltaC');
  if(!cv || !_deltaCFond || !_deltaCGeo) return;
  var g=_deltaCGeo, ctx=cv.getContext('2d');
  ctx.putImageData(_deltaCFond,0,0);
  var tc=Math.max(g.TKA_MIN,Math.min(g.TKA_MAX,t));
  var x=g.PADL+(tc-g.TKA_MIN)/(g.TKA_MAX-g.TKA_MIN)*(g.W-g.PADL-g.PADR);
  var v=anomaliePaleo(tc,g.forage);
  var y=g.H-g.PADB-(v-g.mn)/(g.mx-g.mn)*(g.H-g.PADT-g.PADB);
  ctx.fillStyle='#f38ba8';
  ctx.beginPath(); ctx.arc(x,y,3,0,2*Math.PI); ctx.fill();
}

canvas.addEventListener('wheel',e=>{
  e.preventDefault(); if(!currentOSC()) return;
  const r=canvas.getBoundingClientRect();
  const cx=(e.clientX-r.left)/r.width, cy=(e.clientY-r.top)/r.height;
  const sx0=srcX+cx*DISP*srcPPx, sy0=srcY+cy*DISP*srcPPx;
  srcPPx=Math.max(1/16,Math.min(srcPPx*(e.deltaY>0?1.15:1/1.15),Math.max(imgW,imgH)/DISP));
  srcX=sx0-cx*DISP*srcPPx; srcY=sy0-cy*DISP*srcPPx;
  render();
},{passive:false});

let drag=false,dragX0=0,dragY0=0,dragSX0=0,dragSY0=0;

// OVERLAY COORDONNÉES (lon/lat/altitude ou niveau eau)
// ════════════════════════════════════════════════════════════════
canvas.addEventListener('mousemove',e=>{
  if(!elevGrid||!GEO) return;
  const r=canvas.getBoundingClientRect();
  const cx=(e.clientX-r.left)/r.width, cy=(e.clientY-r.top)/r.height;
  const px=srcX+cx*DISP*srcPPx, py=srcY+cy*DISP*srcPPx;
  const lon=GEO.lonMin+px/imgW*(GEO.lonMax-GEO.lonMin);
  const lat=GEO.latMax-py/imgH*(GEO.latMax-GEO.latMin);
  const col=Math.round(px), row=Math.round(py);
  let alt='mer';
  if(col>=0&&col<imgW&&row>=0&&row<imgH){
    const idx=row*imgW+col, v=elevGrid[idx];
    if(wet&&wet.has(idx)){
      const prof=waterLevel-v;
      alt=`eau surf. ${waterLevel.toFixed(0)} m${prof>0?` (prof. ${prof.toFixed(0)} m)`:''}`;
    } else if(v>0.5&&v<9000) alt=`${v.toFixed(0)} m`;
  }
  // Valeur insolation du pixel si la carte insol est affichée (en W/m²)
  let insolTxt='';
  if (typeof insolActive!=='undefined' && insolActive && insolMap){
    const g=OMBRE_DIM;
    const gc=Math.min(g-1,Math.max(0,Math.round(px/(imgW-1)*(g-1))));
    const gr=Math.min(g-1,Math.max(0,Math.round(py/(imgH-1)*(g-1))));
    const vi=insolMap[gr*g+gc];
    if(vi>0) insolTxt=`  ☀️ ${(vi*INSOL_W_PAR_H).toFixed(0)} W/m²`;
  }
  coordEl.textContent=`${toDMS(lat,true)}  ${toDMS(lon,false)}  ${alt}${insolTxt}`;
});

let cartoMap=null, cartoOn=false;
const cartoBtn=document.getElementById('btn-carto');
const lmapEl=document.getElementById('lmap');

function syncCarto(){
  if(!cartoMap||!GEO) return;
  const dlon=GEO.lonMax-GEO.lonMin;
  const lonC=GEO.lonMin+(srcX+DISP*srcPPx/2)/imgW*dlon;
  const latC=GEO.latMax-(srcY+DISP*srcPPx/2)/imgH*(GEO.latMax-GEO.latMin);
  cartoMap.setView([latC,lonC],Math.log2(imgW*360/(srcPPx*dlon*256)),{animate:false});
}

cartoBtn.addEventListener('click',()=>{
  cartoOn=!cartoOn;
  cartoBtn.textContent=cartoOn?'🗺 Carto ✓':'🗺 Carto';
  cartoBtn.style.borderColor=cartoOn?'#89b4fa':'';
  if(cartoOn){
    lmapEl.style.display='block';
    if(!cartoMap){
      cartoMap=L.map('lmap',{zoomControl:false,dragging:false,scrollWheelZoom:false,
        doubleClickZoom:false,keyboard:false,zoomSnap:0});
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
        {opacity:0.75,attribution:'© Carto © OSM'}).addTo(cartoMap);
    }
    syncCarto();
  } else lmapEl.style.display='none';
});

let mediaRecorder=null, recordedChunks=[];

  .find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';

    recordedChunks=[];

    mediaRecorder=new MediaRecorder(stream,{mimeType:REC_MIME});
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      recBtn.textContent='⏺ REC'; recBtn.classList.remove('recording');
      const blob=new Blob(recordedChunks,{type:'video/webm'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=`dsm_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.webm`;
      a.click(); URL.revokeObjectURL(url);
    };
    mediaRecorder.start(200);
    recBtn.textContent='⏹ STOP'; recBtn.classList.add('recording');
  }
});

// MODE VIDÉO 365 JOURS — AVI MJPEG maison, 10fps EXACT
// MediaRecorder horodate en temps réel → inutilisable pour un fps fixe.
// Ici : on accumule 365 JPEG (canvas.toBlob), puis on construit le
// fichier AVI nous-mêmes — le header déclare dwRate=10/dwScale=1,
// donc la durée est mathématiquement 36.5 s quel que soit le temps
// de génération. Lisible : VLC, ffmpeg, lecteurs classiques.
// Passe 2 en mode soloLever : 1 seul pas calculé par jour (gain ×40).
// ════════════════════════════════════════════════════════════════
let videoRunning    = false;
let videoFrameReady = null;       // callback injecté dans lancerPasse2Seule
let videoFrames     = [];         // Uint8Array[] — un JPEG par jour
const VIDEO_FPS     = 10;
const VIDEO_JPEG_Q  = 0.85;

const videoBtnEl = document.getElementById('btn-video');
videoBtnEl.addEventListener('click', function() {
  if (videoRunning) videoStop(true);   // true = abandon, pas de fichier
  else videoStart();
});

// ── aviBuild — assemble un AVI MJPEG à partir des JPEG accumulés ──────────────
function aviBuild(frames, W, H, fps) {
  var n = frames.length;
  // Tailles des chunks movi : '00dc' + size(4) + data + pad pair
  var moviDataSize = 0, maxFrame = 0;
  for (var i = 0; i < n; i++) {
    var sz = frames[i].length;
    moviDataSize += 8 + sz + (sz & 1);
    if (sz > maxFrame) maxFrame = sz;
  }
  var hdrlSize = 4 + (8+56) + (8 + 4 + (8+56) + (8+40));   // 'hdrl'+avih+LIST strl
  var moviSize = 4 + moviDataSize;                          // 'movi'+chunks
  var idx1Size = 16 * n;
  var riffSize = 4 + (8+hdrlSize) + (8+moviSize) + (8+idx1Size); // 'AVI '+LISTs+idx1
  var total    = 8 + riffSize;

  var buf = new ArrayBuffer(total);
  var v   = new DataView(buf);
  var u8  = new Uint8Array(buf);
  var o   = 0;
  function fcc(s){ for(var k=0;k<4;k++) u8[o++]=s.charCodeAt(k); }
  function u32(x){ v.setUint32(o,x,true); o+=4; }
  function u16(x){ v.setUint16(o,x,true); o+=2; }

  fcc('RIFF'); u32(riffSize); fcc('AVI ');

  // ── LIST hdrl ──
  fcc('LIST'); u32(hdrlSize); fcc('hdrl');
  // avih — MainAVIHeader
  fcc('avih'); u32(56);
  u32(Math.round(1e6/fps));        // dwMicroSecPerFrame
  u32(maxFrame*fps);               // dwMaxBytesPerSec
  u32(0);                          // dwPaddingGranularity
  u32(0x10);                       // dwFlags = AVIF_HASINDEX
  u32(n);                          // dwTotalFrames
  u32(0);                          // dwInitialFrames
  u32(1);                          // dwStreams
  u32(maxFrame);                   // dwSuggestedBufferSize
  u32(W); u32(H);                  // dwWidth, dwHeight
  u32(0); u32(0); u32(0); u32(0);  // dwReserved[4]
  // LIST strl
  fcc('LIST'); u32(4+(8+56)+(8+40)); fcc('strl');
  // strh — AVIStreamHeader
  fcc('strh'); u32(56);
  fcc('vids'); fcc('MJPG');
  u32(0);                          // dwFlags
  u16(0); u16(0);                  // wPriority, wLanguage
  u32(0);                          // dwInitialFrames
  u32(1);                          // dwScale
  u32(fps);                        // dwRate → fps = dwRate/dwScale
  u32(0);                          // dwStart
  u32(n);                          // dwLength (frames)
  u32(maxFrame);                   // dwSuggestedBufferSize
  u32(0xFFFFFFFF);                 // dwQuality
  u32(0);                          // dwSampleSize
  u16(0); u16(0); u16(W); u16(H);  // rcFrame
  // strf — BITMAPINFOHEADER
  fcc('strf'); u32(40);
  u32(40);                         // biSize
  u32(W); u32(H);                  // biWidth, biHeight
  u16(1); u16(24);                 // biPlanes, biBitCount
  fcc('MJPG');                     // biCompression
  u32(W*H*3);                      // biSizeImage
  u32(0); u32(0); u32(0); u32(0);  // reste

  // ── LIST movi ──
  fcc('LIST'); u32(moviSize); fcc('movi');
  var offsets = new Array(n);      // offsets relatifs pour idx1
  var moviStart = o;               // juste après 'movi'
  for (var i = 0; i < n; i++) {
    offsets[i] = o - moviStart + 4;  // convention : offset depuis le fourcc 'movi'
    fcc('00dc'); u32(frames[i].length);
    u8.set(frames[i], o); o += frames[i].length;
    if (frames[i].length & 1) u8[o++] = 0;  // pad pair
  }

  // ── idx1 ──
  fcc('idx1'); u32(idx1Size);
  for (var i = 0; i < n; i++) {
    fcc('00dc');
    u32(0x10);                     // AVIIF_KEYFRAME
    u32(offsets[i]);
    u32(frames[i].length);
  }

  return new Blob([buf], {type:'video/x-msvideo'});
}

function videoStart() {
  if (!ombreHorizonCopy ) {
    document.getElementById('vstatus').textContent =
      'Calculer l\'ombre terrain d\'abord';
    return;
  }
  videoRunning = true;
  videoFrames  = [];
  videoBtnEl.textContent = '⏹ Stop vidéo';
  videoBtnEl.classList.add('running');
  videoLoopJour(0);
}

function videoStop(abandon) {
  videoRunning    = false;
  videoFrameReady = null;
  videoBtnEl.textContent = '🎬 Vidéo 365j';
  videoBtnEl.classList.remove('running');

  if (!abandon && videoFrames.length > 0) {
    document.getElementById('vstatus').textContent =
      '🎬 Assemblage AVI ' + videoFrames.length + ' frames…';
    var blob = aviBuild(videoFrames, OMBRE_DIM, OMBRE_DIM, VIDEO_FPS);
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    a.download = 'ombre365_' + ctrlAnnee + '_' +
      new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.avi';
    a.click();
    URL.revokeObjectURL(url);
    document.getElementById('vstatus').textContent =
      '🎬 AVI prêt — ' + videoFrames.length + ' frames @' + VIDEO_FPS +
      'fps = ' + (videoFrames.length/VIDEO_FPS).toFixed(1) + 's';
  } else {
    document.getElementById('vstatus').textContent =
      'Vidéo abandonnée — ' + jourVersDate(ctrlJour);
  }
  videoFrames = [];
  // Restaurer la navigation : recalcul journée complète du jour courant
  declencherPasse2();
}

function videoLoopJour(j) {
  if (!videoRunning) return;
  if (j > 364) { videoStop(false); return; }   // tour complet → fichier

  ctrlJour = j;
  insolDay = j;

  var rh = ctrlRiseSet();
  var rise = (rh && rh.rise >= 0) ? rh.rise : 0;

  ctrlHeure = rise + 0.001;
  insolHour = ctrlHeure;

  videoFrameReady = function() {
    videoFrameReady = null;
    if (!videoRunning) return;

    // Rendre la frame ombre (pas lever = step 0) directement sur canvas
    var W = OMBRE_DIM, H = OMBRE_DIM;
    var imgData = ctx.createImageData(W, H);
    var src = ombrePasse3Src.data, dst = imgData.data;
    for (var i = 0; i < W * H; i++) {
      var m = ombreMask[i];        // soloLever → 1 seul pas, offset 0
      var p = i * 4;
      var f = (m & 0x01) ? ((m & 0x02) ? 0.50 : OMBRE_SHADE) : 1.0;
      dst[p]   = src[p]   * f;
      dst[p+1] = src[p+1] * f;
      dst[p+2] = src[p+2] * f;
      dst[p+3] = src[p+3];
    }
    ctx.putImageData(imgData, 0, 0);

    // Overlay date + heure lever + lat/lon centre tuile
    var lat = (GEO.latMax + GEO.latMin) / 2;
    var lon = (GEO.lonMax + GEO.lonMin) / 2;
    var label = jourVersDate(j) + '  ' + hDecToHHMM(rise) +
      '   ' + lat.toFixed(3) + '\u00b0 ' + lon.toFixed(3) + '\u00b0';
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(6, 6, ctx.measureText(label).width + 16, 26);
    ctx.fillStyle = '#f9e2af';
    ctx.fillText(label, 14, 24);

    document.getElementById('vstatus').textContent =
      '🎬 ' + (j+1) + '/365 — ' + jourVersDate(j) + ' ' + hDecToHHMM(rise);

    // Capturer la frame JPEG puis jour suivant — aussi vite que possible
    canvas.toBlob(function(blob) {
      if (!videoRunning) return;
      blob.arrayBuffer().then(function(ab) {
        videoFrames.push(new Uint8Array(ab));
        videoLoopJour(j + 1);
      });
    }, 'image/jpeg', VIDEO_JPEG_Q);
  };

  lancerPasse2Seule(true);   // soloLever : 1 seul pas calculé
}
