<!DOCTYPE html>
<html lang="fr">
<head>
<!--
  Fichier  : dsm.html
  Date     : 2026-06-10
  Version  : 3.7 — Recalcul auto jour/année (debounce 150ms, garde ombreHorizonCopy) ;
             vidéo AVI MJPEG maison 10fps exact (header dwRate, durée 36.5s garantie) ;
             passe 2 vidéo soloLever (1 pas, ×40) ; overlay date/heure/lat/lon ;
             workers passe 1 persistants (grille envoyée 1 fois, file d'azimuts)
  Rôle     : Viewer DSM Copernicus — page fille de map.html
  Entrée   : File object reçu via BroadcastChannel depuis map.html
  Worker   : readTiffTags + DecompressionStream + Float32 + hypsométrie + contours
             → renvoie elevGrid + pixels RGBA (zero-copy transferables)
  INSOL_WORKER : La2004 (IMCCE) + insolsub_f.f (BDL) — lever/coucher 365j
  Fil prin.: navigation | eau | légende | Leaflet | REC | vidéo 365j
  Eau      : RAF, Set border-front, montée si bloqué — GELÉ
  Géo      : tags GeoTIFF 33550 / 33922
  Auteur   : Eric Perret
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSM — En attente</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;
  color:#cdd6f4;font-family:'Segoe UI',Arial,sans-serif}
#topbar{position:fixed;top:0;left:0;right:0;height:42px;z-index:2000;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(13,17,23,.88);backdrop-filter:blur(4px);
  border-bottom:1px solid #2a2d3d}
#titre{font-size:.82rem;font-weight:600;color:#b4befe;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1}
.btn{font-size:.70rem;padding:3px 11px;border:1px solid #45475a;border-radius:4px;
  background:#181825;color:#cdd6f4;cursor:pointer;white-space:nowrap}
.btn:hover{background:#2a2d3d;border-color:#89b4fa}
.btn:disabled{opacity:.3;cursor:default}
#btn-rec.recording{border-color:#f38ba8;color:#f38ba8}
#btn-video.running{border-color:#a6e3a1;color:#a6e3a1}
/* Toggle robinet/glacier */
#btn-mode{min-width:110px}
#btn-mode.glacier{border-color:#89dceb;color:#89dceb}
/* Bouton ombre terrain */
#btn-ombre{min-width:100px}
#btn-ombre.active{border-color:#f9e2af;color:#f9e2af}
/* Panneau lever/coucher soleil — DÉSACTIVÉ (remplacé par #ctrl-panel) */
/* ── Panneau contrôle gauche — Année / Jour / Heure ── */
#ctrl-panel{
  width:130px;flex-shrink:0;height:100%;
  display:none;flex-direction:column;align-items:stretch;
  padding:10px 6px 8px;gap:14px;
  background:rgba(20,24,32,.85);border:1px solid #2a2d3d;border-radius:6px}
#ctrl-panel.visible{display:flex}
.ctrl-bloc{display:flex;flex-direction:column;align-items:stretch;gap:3px}
.ctrl-label{font-size:.58rem;color:#a6adc8;letter-spacing:.06em;
  text-align:center;padding:1px 0}
.ctrl-label.actif{color:#f9e2af;background:rgba(249,226,175,.10);
  border-radius:3px}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:2px}
.ctrl-pm{font-size:.75rem;padding:1px 6px;border:1px solid #45475a;border-radius:3px;
  background:#181825;color:#cdd6f4;cursor:pointer;line-height:1.4;
  user-select:none;flex-shrink:0}
.ctrl-pm:hover{background:#2a2d3d;border-color:#89b4fa}
.ctrl-val{font-size:.78rem;font-weight:700;color:#cdd6f4;
  text-align:center;flex:1;font-family:'Courier New',monospace;
  white-space:nowrap;overflow:hidden}
.ctrl-bar-wrap{width:100%;height:8px;background:#1e2030;border-radius:4px;
  cursor:pointer;position:relative;overflow:hidden}
.ctrl-bar-fill{height:100%;border-radius:4px;background:#585b70;
  pointer-events:none;transition:width .08s}
#main{position:fixed;top:42px;left:0;right:0;bottom:26px;
  display:flex;flex-direction:row;align-items:center;justify-content:center;
  gap:8px;padding:0 8px;background:#0d1117}
#wrap{position:relative;overflow:hidden;cursor:grab;background:#141820;flex-shrink:0}
#wrap.dragging{cursor:grabbing}
#wrap canvas{width:100%;height:100%;display:block}
#lmap{position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:10;display:none;background:transparent}
#lmap .leaflet-control-attribution{font-size:.45rem;opacity:.4}
#coords{position:absolute;top:8px;left:8px;z-index:20;
  font-size:.65rem;font-family:'Courier New',monospace;color:#f5e0dc;
  background:rgba(13,17,23,.78);padding:3px 9px;border-radius:4px;
  pointer-events:none;white-space:nowrap;letter-spacing:.03em}
#placeholder{position:absolute;inset:0;z-index:5;display:flex;
  align-items:center;justify-content:center;color:#45475a;font-size:.85rem;
  pointer-events:none;text-align:center;padding:20px}
#legend-panel{width:72px;flex-shrink:0;height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:10px 4px 6px;gap:4px;
  background:rgba(20,24,32,.85);border:1px solid #2a2d3d;border-radius:6px}

#lcv{width:60px;flex:1;display:block;border-radius:3px}

#vbar{position:fixed;bottom:0;left:0;right:0;height:26px;z-index:2000;
  display:flex;align-items:center;padding:0 12px;gap:10px;
  background:rgba(13,17,23,.88);border-top:1px solid #1e2030;font-size:.62rem}
#vstatus{flex:1;color:#a6e3a1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vinfo{color:#45475a;white-space:nowrap}
</style>
</head>

<script>
// ════════════════════════════════════════════════════════════════
// WORKER INLINE — Blob URL (fonctionne sur file:// et http://)
// Tout le décodage TIFF tourne hors fil principal.
// Retourne (zero-copy) : elevGrid F32 + hypsoPixels RGBA + contourPixels RGBA
// ════════════════════════════════════════════════════════════════
const WORKER_SRC = `
// ── Tags TIFF ──────────────────────────────────────────────────
function readTiffTags(buf) {
  var v=new DataView(buf), le=(v.getUint16(0,true)===0x4949);
  var r16=function(o){return v.getUint16(o,le);};
  var r32=function(o){return v.getUint32(o,le);};
  var ifd=r32(4), t={}, ne=r16(ifd);
  for(var i=0;i<ne;i++){
    var base=ifd+2+i*12, tag=r16(base), type=r16(base+2),
        cnt=r32(base+4), vo=base+8;
    (function(tag,type,cnt,vo){
      function vals(){
        var sz=[0,1,1,2,4,8,1,1,2,4,8,4,8][type]||1;
        var start=sz*cnt>4?r32(vo):vo, arr=[];
        for(var j=0;j<cnt;j++){
          var p=start+j*sz;
          if(type===3)arr.push(v.getUint16(p,le));
          else if(type===4)arr.push(v.getUint32(p,le));
          else if(type===12)arr.push(v.getFloat64(p,le));
          else if(type===16)arr.push(Number(v.getBigUint64(p,le)));
          else arr.push(v.getUint32(p,le));
        }
        return arr;
      }
      switch(tag){
        case 256:t.width=vals()[0];break;    case 257:t.height=vals()[0];break;
        case 258:t.bps=vals()[0];break;      case 317:t.predictor=vals()[0];break;
        case 322:t.tileW=vals()[0];break;    case 323:t.tileH=vals()[0];break;
        case 324:t.tileOffsets=vals();break; case 325:t.tileByteCounts=vals();break;
        case 339:t.sampleFormat=vals()[0];break;
        case 33550:t.pixelScale=vals();break; case 33922:t.tiepoint=vals();break;
      }
    })(tag,type,cnt,vo);
  }
  return t;
}

// ── Inflate natif (DecompressionStream — disponible dans Workers) ──
async function inflateNative(uint8){
  var raw=uint8.slice(2,uint8.length-4);
  var ds=new DecompressionStream('deflate-raw');
  var writer=ds.writable.getWriter(), reader=ds.readable.getReader();
  writer.write(raw).then(function(){writer.close();});
  var chunks=[], totalLen=0;
  while(true){var r=await reader.read(); if(r.done)break; chunks.push(r.value); totalLen+=r.value.length;}
  var out=new Uint8Array(totalLen), off=0;
  for(var i=0;i<chunks.length;i++){out.set(chunks[i],off);off+=chunks[i].length;}
  return out;
}

// ── Décodage tuile Float32 (Predictor=3, fpAcc) ────────────────
async function decodeTile(buf,offset,byteCount,tileW,tileH){
  var raw=await inflateNative(new Uint8Array(buf,offset,byteCount));
  var rowBytes=tileW*4, out=new Float32Array(tileW*tileH), tmp=new Uint8Array(out.buffer);
  for(var row=0;row<tileH;row++){
    var rs=row*rowBytes;
    for(var i=rs+1;i<rs+rowBytes;i++) raw[i]=(raw[i]+raw[i-1])&0xFF;
    var base=row*tileW;
    for(var i=0;i<tileW;i++){
      tmp[(base+i)*4+0]=raw[rs+3*tileW+i]; tmp[(base+i)*4+1]=raw[rs+2*tileW+i];
      tmp[(base+i)*4+2]=raw[rs+1*tileW+i]; tmp[(base+i)*4+3]=raw[rs+0*tileW+i];
    }
  }
  return out;
}

// ── LUT hypsométrique ──────────────────────────────────────────
function makeHypsoLUT(){
  var stops=[[0.00,20,90,20],[0.12,80,160,50],[0.25,180,170,80],
    [0.40,180,130,50],[0.58,140,85,30],[0.74,130,100,80],
    [0.88,200,190,180],[1.00,255,255,255]];
  var lut=new Uint8Array(256*3);
  for(var i=0;i<256;i++){
    var t=i/255, s0=stops[0], s1=stops[1];
    for(var k=0;k<stops.length-1;k++)
      if(t>=stops[k][0]&&t<=stops[k+1][0]){s0=stops[k];s1=stops[k+1];break;}
    var f=s1[0]===s0[0]?0:(t-s0[0])/(s1[0]-s0[0]);
    lut[i*3]=Math.round(s0[1]+f*(s1[1]-s0[1]));
    lut[i*3+1]=Math.round(s0[2]+f*(s1[2]-s0[2]));
    lut[i*3+2]=Math.round(s0[3]+f*(s1[3]-s0[3]));
  }
  return lut;
}

// ── Grille élévation + pixels RGBA hypsométriques ─────────────
// Égalisation d'histogramme (10 000 bins) pour maximiser le contraste.
// Pixels placés dans un tableau W×H global (pas tuile par tuile).
async function buildElevAndHypso(buf,t,lut){
  var W=t.width, H=t.height, tileW=t.tileW, tileH=t.tileH;
  var tileOffsets=t.tileOffsets, tileByteCounts=t.tileByteCounts;
  var tilesX=Math.ceil(W/tileW), tilesY=Math.ceil(H/tileH);
  var totalTiles=tilesX*tilesY;
  var elevGrid=new Float32Array(W*H);
  var tiles=[], vmin=Infinity, vmax=-Infinity;

  for(var ty=0;ty<tilesY;ty++) for(var tx=0;tx<tilesX;tx++){
    var idx=ty*tilesX+tx;
    var tw=Math.min(tileW,W-tx*tileW), th=Math.min(tileH,H-ty*tileH);
    var data=await decodeTile(buf,tileOffsets[idx],tileByteCounts[idx],tileW,tileH);
    tiles.push({data:data,tw:tw,th:th,tx:tx,ty:ty});
    for(var r=0;r<th;r++) for(var c=0;c<tw;c++){
      var v=data[r*tileW+c];
      elevGrid[(ty*tileH+r)*W+(tx*tileW+c)]=v;
      if(v>0.5&&v<9000){if(v<vmin)vmin=v; if(v>vmax)vmax=v;}
    }
    self.postMessage({type:'progress',msg:'Décodage tuile '+(idx+1)+'/'+totalTiles+'…'});
  }

  var NBINS=10000, hist=new Uint32Array(NBINS), vrange=vmax-vmin||1;
  for(var i=0;i<tiles.length;i++){
    var tile=tiles[i];
    for(var r=0;r<tile.th;r++) for(var c=0;c<tile.tw;c++){
      var v=tile.data[r*tileW+c];
      if(v>0.5&&v<9000) hist[Math.min(NBINS-1,Math.floor((v-vmin)/vrange*NBINS))]++;
    }
  }
  var tot=0; for(var b=0;b<NBINS;b++) tot+=hist[b];
  var binToLut=new Uint8Array(NBINS), cumul=0;
  for(var b=0;b<NBINS;b++){cumul+=hist[b]; binToLut[b]=Math.min(255,Math.floor(cumul/tot*256));}

  var hypsoPixels=new Uint8ClampedArray(W*H*4);
  for(var i=0;i<tiles.length;i++){
    var tile=tiles[i];
    for(var r=0;r<tile.th;r++) for(var c=0;c<tile.tw;c++){
      var v=tile.data[r*tileW+c];
      var o=((tile.ty*tileH+r)*W+(tile.tx*tileW+c))*4;
      if(v<=0.5||v>=9000){hypsoPixels[o]=20;hypsoPixels[o+1]=60;hypsoPixels[o+2]=130;hypsoPixels[o+3]=255;}
      else{var li=binToLut[Math.min(NBINS-1,Math.floor((v-vmin)/vrange*NBINS))]*3;
        hypsoPixels[o]=lut[li];hypsoPixels[o+1]=lut[li+1];hypsoPixels[o+2]=lut[li+2];hypsoPixels[o+3]=255;}
    }
  }
  return {elevGrid:elevGrid, vmin:vmin, vmax:vmax, hypsoPixels:hypsoPixels};
}

// ── Marching Squares — bitmap contours (OffscreenCanvas dans le Worker) ──
//
// Table LINES[idx] = paires d'arêtes à connecter (0=haut 1=droite 2=bas 3=gauche).
// idx construit bit par bit : bit0=TL bit1=TR bit2=BR bit3=BL (1 si > seuil).
// edgePt : interpolation linéaire sub-pixel sur l'arête.
//
// Stratégie performance :
//   Une seule passe cellulaire par style (minor / major).
//   Pour chaque cellule, on cherche les niveaux dans [cellMin,cellMax] par pas
//   → on ne teste jamais les niveaux qui ne coupent pas la cellule.
//   Résultat : deux ctx.stroke() au total, quelque soit le nombre de niveaux.
function buildContourBitmap(elevGrid,W,H,vmin,vmax){
  var interval=vmax>800?100:vmax>300?50:20, major=interval*5;

  // Table Marching Squares — 16 cas, chacun 0, 1 ou 2 segments
  var LINES=[
    [],[[0,3]],[[0,1]],[[1,3]],
    [[1,2]],[[0,3],[1,2]],[[0,2]],[[2,3]],
    [[2,3]],[[0,2]],[[0,1],[2,3]],[[1,2]],
    [[1,3]],[[0,1]],[[0,3]],[]
  ];

  // Coordonnée du point de croisement sur l'arête e (espace pixel = espace grille)
  function ep(e,c,r,TL,TR,BR,BL,t){
    var d,f;
    if(e===0){d=TR-TL; f=d?(t-TL)/d:.5; return[c+f,r];}
    if(e===1){d=BR-TR; f=d?(t-TR)/d:.5; return[c+1,r+f];}
    if(e===2){d=BR-BL; f=d?(t-BL)/d:.5; return[c+f,r+1];}
    d=BL-TL; f=d?(t-TL)/d:.5; return[c,r+f];
  }

  var osc=new OffscreenCanvas(W,H), ctx=osc.getContext('2d');

  // 1. Fond : blanc (terre) / bleu (mer)
  var bg=new Uint8ClampedArray(W*H*4);
  for(var i=0;i<W*H;i++){
    var v=elevGrid[i], o=i*4;
    if(v<=0.5||v>=9000){bg[o]=20;bg[o+1]=60;bg[o+2]=130;}
    else{bg[o]=255;bg[o+1]=255;bg[o+2]=255;}
    bg[o+3]=255;
  }
  ctx.putImageData(new ImageData(bg,W,H),0,0);
  bg=null;

  // 2. Isolignes Marching Squares — une passe par style
  function drawPass(stepLv, skipMod, color, lw){
    ctx.strokeStyle=color; ctx.lineWidth=lw;
    ctx.beginPath();
    for(var r=0;r<H-1;r++) for(var c=0;c<W-1;c++){
      var TL=elevGrid[r*W+c], TR=elevGrid[r*W+c+1];
      var BR=elevGrid[(r+1)*W+c+1], BL=elevGrid[(r+1)*W+c];
      if(TL<=0.5||TR<=0.5||BR<=0.5||BL<=0.5) continue;
      var cMin=TL,cMax=TL;
      if(TR<cMin)cMin=TR; if(TR>cMax)cMax=TR;
      if(BR<cMin)cMin=BR; if(BR>cMax)cMax=BR;
      if(BL<cMin)cMin=BL; if(BL>cMax)cMax=BL;
      // Premier niveau >= cMin aligné sur stepLv
      var first=Math.ceil(cMin/stepLv)*stepLv;
      for(var lv=first;lv<=cMax;lv+=stepLv){
        if(skipMod&&(lv%skipMod===0)) continue;
        var idx=(TL>lv?1:0)|(TR>lv?2:0)|(BR>lv?4:0)|(BL>lv?8:0);
        var segs=LINES[idx];
        for(var s=0;s<segs.length;s++){
          var p0=ep(segs[s][0],c,r,TL,TR,BR,BL,lv);
          var p1=ep(segs[s][1],c,r,TL,TR,BR,BL,lv);
          ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]);
        }
      }
    }
    ctx.stroke();
  }

  drawPass(interval, major,  'rgba(110,78,28,.55)', 0.7);  // mineures
  drawPass(major,    0,      'rgba(62,36,8,.90)',   1.6);   // majeures

  return {bitmap:osc.transferToImageBitmap(), interval:interval, major:major};
}

// ── Point d'entrée Worker ──────────────────────────────────────
self.onmessage=async function(e){
  if(e.data.type!=='load') return;
  try{
    var buf=e.data.buffer;
    self.postMessage({type:'progress',msg:'Lecture tags TIFF\u2026'});
    var t=readTiffTags(buf);
    var geo=(t.tiepoint&&t.pixelScale)?{
      lonMin:t.tiepoint[3], latMax:t.tiepoint[4],
      lonMax:t.tiepoint[3]+t.width*t.pixelScale[0],
      latMin:t.tiepoint[4]-t.height*t.pixelScale[1]
    }:null;
    var lut=makeHypsoLUT();
    var res=await buildElevAndHypso(buf,t,lut);
    self.postMessage({type:'progress',msg:'Marching Squares\u2026'});

// ── Interpolation linéaire dans la table ─────────────────────────────────
// t_ka : 0 à -250 (valeurs négatives ou nulles)
function orbital(t_ka) {
  var tk = Math.min(0, t_ka);
  var i0 = Math.min(Math.floor(-tk), 249);
  var i1 = i0 + 1;
  var f  = (-tk) - i0;
  var r0 = LA2004[i0], r1 = LA2004[i1];
  return {
    e:   r0[0] + f*(r1[0]-r0[0]),
    eps: r0[1] + f*(r1[1]-r0[1]),
    pib: r0[2] + f*(r1[2]-r0[2])
  };
}

// ── vraimoy : longitude vraie → longitude moyenne, ordre 5 en e ──────────
// Source : insolsub_f.f, subroutine vraimoy (ASD/BDL, Laskar 1993-2010)
function vraimoy(hl, e, pibar) {
  var eV = hl - pibar;
  return hl
    - 2*e                           * Math.sin(eV)
    + (3*e*e/4 + e*e*e*e/8)         * Math.sin(2*eV)
    - (e*e*e/3 + e*e*e*e*e/8)       * Math.sin(3*eV)
    + 5*e*e*e*e/32                  * Math.sin(4*eV)
    - 3*e*e*e*e*e/40                * Math.sin(5*eV);
}

// ── moyvrai : longitude moyenne → longitude vraie, ordre 5 en e ──────────
// Source : insolsub_f.f, subroutine moyvrai (ASD/BDL, Laskar 1993-2010)
function moyvrai(hlm, e, pibar) {
  var eM = hlm - pibar;
  return hlm
    + (2*e - e*e*e/4 + 5*e*e*e*e*e/96) * Math.sin(eM)
    + (5*e*e/4 - 11*e*e*e*e/24)         * Math.sin(2*eM)
    + (13*e*e*e/12 - 43*e*e*e*e*e/64)   * Math.sin(3*eM)
    + 103*e*e*e*e/96                     * Math.sin(4*eM)
    + 1097*e*e*e*e*e/960                 * Math.sin(5*eM);
}

// ── sunRiseSet : lever/coucher pour 1 jour ────────────────────────────────
// Source : insolsub_f.f, subroutine cwj + formule angle horaire (ASD/IMCCE)
// j      : jour julien 1..365 (1=1er jan)
// t_ka   : temps en ka (0=aujourd'hui, négatif=passé)
// lat    : latitude en radians
// lon    : longitude en degrés EST
// Retour : { rise, set } en heures UTC décimales, ou { rise:-1, set:-1 }
function sunRiseSet(j, t_ka, lat, lon) {
  var orb    = orbital(t_ka);
  var e      = orb.e;
  var eps    = orb.eps;
  var pibarh = orb.pib;
  // pibar géocentrique (convention insolsub_f.f ligne : pibar=pibarh+pi)
  var pibar  = pibarh + Math.PI;

  // Longitude vraie du soleil au jour j
  // Equinoxe vernal = j≈80 (21 mars), longitude vraie = 0
  // Longitude moyenne à l'équinoxe vernal :
  var hlm_eq = vraimoy(0, e, pibar);
  // Longitude moyenne au jour j (mouvement angulaire uniforme)
  var hlm    = hlm_eq + (j - 80) * 2 * Math.PI / 365.25;
  // Longitude vraie au jour j
  var wd     = moyvrai(hlm, e, pibar);

  // Déclinaison (cwj insolsub_f.f : sinusdelta = sin(eps)*sin(wd))
  var sinD = Math.sin(eps) * Math.sin(wd);
  var decl = Math.asin(Math.max(-1, Math.min(1, sinD)));

  // Test nuit/jour polaire
  var cosH = -Math.tan(lat) * Math.tan(decl);
  if (cosH >  1) return { rise: -1, set: -1 };  // nuit polaire
  if (cosH < -1) return { rise:  0, set: 24 };   // jour polaire

  var ho      = Math.acos(cosH);          // angle horaire lever (rad)
  var halfDay = ho * 12.0 / Math.PI;      // demi-durée du jour (heures)

  // Équation du temps → midi solaire vrai en UTC
  // Anomalie moyenne approx (par rapport au périhélie)
  var M    = hlm - pibar;
  // Correction ellipse (1er terme) + obliquité (2e terme) — Meeus ch.27 simplifié
  var eqt  = (-2*e * Math.sin(M)
              - Math.pow(Math.tan(eps/2), 2) * Math.sin(2*wd)
             ) * (180/Math.PI) * 4;       // minutes
  var noon = 12.0 - eqt/60.0 - lon/15.0; // midi solaire en UTC

  return {
    rise: noon - halfDay,
    set:  noon + halfDay
  };
}

// ── Point d'entrée worker ─────────────────────────────────────────────────
self.onmessage = function(e) {
  if (e.data.type !== 'sunpath') return;
  var lat   = e.data.lat_rad;
  var lon   = e.data.lon_deg;
  var t_ka  = e.data.t_ka !== undefined ? e.data.t_ka : 0;
  var rise  = new Float32Array(365);
  var set   = new Float32Array(365);
  for (var j = 1; j <= 365; j++) {
    var rs   = sunRiseSet(j, t_ka, lat, lon);
    rise[j-1] = rs.rise;
    set[j-1]  = rs.set;
  }
  self.postMessage({ type:'done', rise:rise, set:set }, [rise.buffer, set.buffer]);
};
`;

// PANNEAU CONTRÔLE GAUCHE — Année / Jour / Heure
// Clavier : ↑↓ sélectionne le slider actif, ←→ incrémente/décrémente
// Souris  : clic [+]/[-] ou clic sur la barre = position directe
// ════════════════════════════════════════════════════════════════

// ── État contrôle ───────────────────────────────────────────────
const CTRL_ANNEE_MIN = -20000;
const CTRL_ANNEE_MAX = 2100;
let ctrlAnnee  = 2024;     // année affichée
let ctrlJour   = 354;      // 0-based (354 = 21 déc)
let ctrlHeure  = 12.0;     // heures UTC décimales
let ctrlActif  = 1;        // slider actif : 0=année 1=jour 2=heure

// ── ctrlRendrePanneau — met à jour tous les affichages du panneau ─
function ctrlRendrePanneau() {
  // Année
  document.getElementById('ctrl-val-0').textContent =
    ctrlAnnee.toLocaleString('fr-FR').replace(/\u202f/g, '\u00a0');
  var fA = (ctrlAnnee - CTRL_ANNEE_MIN) / (CTRL_ANNEE_MAX - CTRL_ANNEE_MIN);
  document.getElementById('ctrl-fill-0').style.width = (fA * 100).toFixed(1) + '%';

  // Jour
  document.getElementById('ctrl-val-1').textContent = jourVersDate(ctrlJour);
  document.getElementById('ctrl-fill-1').style.width = (ctrlJour / 364 * 100).toFixed(1) + '%';

  // Heure
  document.getElementById('ctrl-val-2').textContent = hDecToHHMM(ctrlHeure);
  var rise = insolRise ? insolRise[ctrlJour] : 0;
  var setH = insolSet  ? insolSet[ctrlJour]  : 24;
  if (rise < 0) rise = 0;
  var span = Math.max(0.01, setH - rise);
  var fH = Math.max(0, Math.min(1, (ctrlHeure - rise) / span));
  document.getElementById('ctrl-fill-2').style.width = (fH * 100).toFixed(1) + '%';

  // Lever / coucher
  if (insolRise) {
    document.getElementById('ctrl-rise').textContent =
      '🌅 ' + hDecToHHMM(insolRise[ctrlJour]);
    document.getElementById('ctrl-set').textContent  =
      '🌇 ' + hDecToHHMM(insolSet[ctrlJour]);
  }

  // Az / él soleil
  if (GEO && insolRise) {
    var orb   = ombreOrbital(ctrlTka());
    var pibar = orb.pib + Math.PI;
    var lat   = (GEO.latMax + GEO.latMin) / 2;
    var lon   = (GEO.lonMax + GEO.lonMin) / 2;
    var pos   = ombreSunPos(ctrlJour + 1, ctrlHeure, orb.e, orb.eps, pibar,
                            lat * Math.PI / 180, lon);
    document.getElementById('ctrl-sunpos').textContent =
      'az ' + pos.az.toFixed(0) + '°  él ' + pos.el.toFixed(1) + '°';
    // Déclencher rendu ombre si passe 3 active
    if (ombreRunning && ombreMask) {
      ctrlMajPas(pos);
    }
  }

  // Highlight label actif
  for (var i = 0; i < 3; i++) {
    var lbl = document.getElementById('ctrl-lbl-' + i);
    lbl.classList.toggle('actif', i === ctrlActif);
  }
}

// ── ctrlTka — année → t_ka (kiloyears before 1950) ───────────────
function ctrlTka() {
  return (1950 - ctrlAnnee) / 1000;
}

// ── ctrlMajPas — choisit le pas ombreStep le plus proche de ctrlHeure
//    puis déclenche ombreRendreFrame ────────────────────────────────
function ctrlMajPas(pos) {
  if (!ombreSunAz || !ombreNSteps) return;


// On trouve l'index (t) directement grace a l'ecart de temps
// 1 pas = 0.25 heure (15 min)
var t = Math.round((ctrlHeure - ombreHeureStart) / 0.25);
ombreStep = Math.max(0, Math.min(ombreNSteps - 1, t));

  ombreSliderDirty = true;
  ombreRendreFrame();
}

// ── declencherPasse2 — debounce 150ms, garde sur ombreHorizonCopy uniquement ─
// (ombreHorizon fait des allers-retours zero-copy et peut être null — ne pas le tester)
let passe2Timer = 0;
function declencherPasse2() {
  clearTimeout(passe2Timer);
  passe2Timer = setTimeout(function() {
    if (ombreHorizonCopy) lancerPasse2Seule();
  }, 150);
}

// ── ctrlIncrementer — appelé par clavier ou boutons +/- ──────────
function ctrlIncrementer(idx, sens) {   // sens = +1 ou -1
  if (idx === 0) {
    // Année
    ctrlAnnee = Math.max(CTRL_ANNEE_MIN, Math.min(CTRL_ANNEE_MAX, ctrlAnnee + sens));
    // Recalculer lever/coucher pour la nouvelle époque
    if (GEO && modeGlacier) lancerInsolation();
    // Recalcul passe 2 si horizon déjà calculé
    declencherPasse2();
  } else if (idx === 1) {
    // Jour
    ctrlJour = Math.max(0, Math.min(364, ctrlJour + sens));
    insolDay = ctrlJour;
    // Clamper heure dans la nouvelle plage lever/coucher
    if (insolRise) {
      var r = insolRise[ctrlJour], s = insolSet[ctrlJour];
      if (r >= 0 && s >= 0)
        ctrlHeure = Math.max(r + 0.001, Math.min(s - 0.001, ctrlHeure));
      insolHour = ctrlHeure;
    }
    // Recalcul passe 2 si horizon déjà calculé
    declencherPasse2();
  } else if (idx === 2) {
    // Heure ± 15 min
    ctrlHeure += sens * 0.25;
    if (insolRise) {
      var r2 = insolRise[ctrlJour], s2 = insolSet[ctrlJour];
      if (r2 >= 0 && s2 >= 0)
        ctrlHeure = Math.max(r2 + 0.001, Math.min(s2 - 0.001, ctrlHeure));
    }
    insolHour = ctrlHeure;
  }
  ctrlRendrePanneau();
}

// ── Clavier ↑↓←→ ────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (!modeGlacier) return;
  if (e.key === 'ArrowUp')    { e.preventDefault(); ctrlActif = Math.max(0, ctrlActif - 1); ctrlRendrePanneau(); }
  if (e.key === 'ArrowDown')  { e.preventDefault(); ctrlActif = Math.min(2, ctrlActif + 1); ctrlRendrePanneau(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); ctrlIncrementer(ctrlActif, -1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); ctrlIncrementer(ctrlActif, +1); }
});

// ── Boutons +/- : clic simple + clic maintenu accéléré ───────────
// Délai initial 380ms, puis repeat à 180ms → 90ms → 45ms → 25ms (paliers ×5)
(function() {
  var pmTimer = 0, pmIdx = -1, pmSens = 0, pmCount = 0;

  function pmStop() {
    clearTimeout(pmTimer); clearInterval(pmTimer);
    pmTimer = 0; pmIdx = -1; pmSens = 0; pmCount = 0;
  }

  function pmTick() {
    if (pmIdx < 0) return;
    ctrlActif = pmIdx;
    ctrlIncrementer(pmIdx, pmSens);
    pmCount++;
    // Accélération par paliers : 180 → 90 → 45 → 25 ms
    var delay = pmCount < 5  ? 180 :
                pmCount < 15 ?  90 :
                pmCount < 30 ?  45 : 25;
    pmTimer = setTimeout(pmTick, delay);
  }

  function pmStart(idx, sens) {
    pmStop();
    pmIdx = idx; pmSens = sens; pmCount = 0;
    ctrlActif = idx;
    ctrlIncrementer(idx, sens);          // réaction immédiate au premier clic
    pmTimer = setTimeout(pmTick, 380);   // délai avant répétition
  }

  for (var i = 0; i < 3; i++) {
    (function(idx) {
      var plus  = document.getElementById('ctrl-plus-'  + idx);
      var minus = document.getElementById('ctrl-minus-' + idx);

      plus.addEventListener('mousedown',  function(e){ e.preventDefault(); pmStart(idx, +1); });
      minus.addEventListener('mousedown', function(e){ e.preventDefault(); pmStart(idx, -1); });
    })(i);
  }

  window.addEventListener('mouseup',    pmStop);
  window.addEventListener('mouseleave', pmStop);
})();

// ── Barre slider : clic direct + drag maintenu ───────────────────
(function() {
  var dragIdx = -1;   // index du slider en cours de drag (-1 = aucun)

  function applyPct(idx, pct) {
    pct = Math.max(0, Math.min(1, pct));
    if (idx === 0) {
      ctrlAnnee = Math.round(CTRL_ANNEE_MIN + pct * (CTRL_ANNEE_MAX - CTRL_ANNEE_MIN));
      if (GEO && modeGlacier) lancerInsolation();
      declencherPasse2();
    } else if (idx === 1) {
      ctrlJour = Math.round(pct * 364);
      insolDay = ctrlJour;
      if (insolRise) {
        var r2 = insolRise[ctrlJour], s2 = insolSet[ctrlJour];
        if (r2 >= 0 && s2 >= 0)
          ctrlHeure = Math.max(r2 + 0.001, Math.min(s2 - 0.001, ctrlHeure));
        insolHour = ctrlHeure;
      }
      declencherPasse2();
    } else {
      if (insolRise) {
        var r3 = insolRise[ctrlJour], s3 = insolSet[ctrlJour];
        if (r3 >= 0 && s3 >= 0) {
          ctrlHeure = r3 + pct * (s3 - r3);
          ctrlHeure = Math.max(r3 + 0.001, Math.min(s3 - 0.001, ctrlHeure));
          insolHour = ctrlHeure;
        }
      }
    }
    ctrlRendrePanneau();
  }

  for (var i = 0; i < 3; i++) {
    (function(idx) {
      var bar = document.getElementById('ctrl-bar-' + idx);
      bar.addEventListener('mousedown', function(e) {
        e.preventDefault();
        ctrlActif = idx;
        dragIdx   = idx;
        var r   = bar.getBoundingClientRect();
        applyPct(idx, (e.clientX - r.left) / r.width);
      });
    })(i);
  }

  window.addEventListener('mousemove', function(e) {
    if (dragIdx < 0) return;
    var bar = document.getElementById('ctrl-bar-' + dragIdx);
    var r   = bar.getBoundingClientRect();
    applyPct(dragIdx, (e.clientX - r.left) / r.width);
  });

  window.addEventListener('mouseup', function() { dragIdx = -1; });
})();

// ── ctrlOuvrir / ctrlFermer ────────────────────────────────────────
function ctrlOuvrir() {
  document.getElementById('ctrl-panel').classList.add('visible');
  ctrlRendrePanneau();
  resizeWrap();
  render();
}
function ctrlFermer() {
  document.getElementById('ctrl-panel').classList.remove('visible');
  resizeWrap();
  render();
}
